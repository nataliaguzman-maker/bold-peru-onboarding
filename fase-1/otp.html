<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Bold – Verifica tu identidad</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Roboto:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../components/shared.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #D0D3E0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 40px 0;
      min-height: 100vh;
    }

    /* ── Phone shell: 393 × 852 ── */
    .phone {
      width: 393px;
      height: 852px;
      background: #F7F8FB;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .header, .body, .footer, .keyboard, .ayuda-btn {
      position: relative;
      z-index: 1;
    }

    /* ══════════════════════════════════════
       HEADER
       ══════════════════════════════════════ */
    .header {
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      gap: 20px;
      padding-bottom: 16px;
    }

    .status-bar {
      height: 20px;
      position: relative;
      display: flex;
      align-items: center;
      padding: 0 8px;
    }
    .status-bar__time {
      position: absolute; left: 50%; top: 50%;
      transform: translate(-50%, -50%);
      font-family: Roboto, sans-serif;
      font-weight: 600; font-size: 12px; color: #1E1E1E; line-height: 1;
    }
    .status-bar__right {
      position: absolute; right: 5px; top: 50%;
      transform: translateY(-50%);
      display: flex; align-items: center; gap: 4px;
    }
    .status-bar__carrier {
      font-family: Roboto, sans-serif;
      font-weight: 400; font-size: 12px;
      letter-spacing: -0.0014em; color: #1E1E1E; line-height: 1;
    }

    .nav-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 12px;
    }
    .nav-left  { width: 102px; display: flex; align-items: center; }
    .nav-center { flex: 1; }
    .nav-right  { width: 102px; display: flex; justify-content: flex-end; }

    /* ══════════════════════════════════════
       BODY
       ══════════════════════════════════════ */
    .body {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 40px;
      padding: 0 16px;
      scrollbar-width: none;
    }
    .body::-webkit-scrollbar { display: none; }

    /* Text section */
    .text-section {
      display: flex;
      flex-direction: column;
      gap: 12px;
      align-self: stretch;
    }
    .title {
      font-family: Montserrat, sans-serif;
      font-weight: 600; font-size: 20px; line-height: 24px; color: #1E1E1E;
    }
    .subtitle {
      font-family: Montserrat, sans-serif;
      font-weight: 400; font-size: 14px; line-height: 20px; color: #1E1E1E;
    }

    /* ── PIN boxes ── */
    .pin-row {
      display: flex;
      justify-content: center;
      gap: 8px;
    }
    .pin-box {
      width: 48px; height: 48px;
      border-radius: 12px;
      border: 1px solid #D2D4E1;
      background: #FFFFFF;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: border-color 0.15s;
    }
    .pin-box--active {
      border: 1.5px solid #121E6C;
    }
    .pin-box--active::after {
      content: '';
      width: 1.5px; height: 22px;
      background: #121E6C;
      border-radius: 1px;
      animation: pin-blink 1.1s step-end infinite;
    }
    @keyframes pin-blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
    .pin-box--filled::after {
      content: '';
      width: 10px; height: 10px;
      border-radius: 50%;
      background: #1E1E1E;
    }

    /* ── WEB/APP Alert – Status=Info ── */
    .alert-info {
      align-self: stretch;
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(18, 30, 108, 0.06);
      border-radius: 16px;
      padding: 12px 16px;
    }
    .alert-info__icon {
      width: 20px; height: 20px;
      flex-shrink: 0;
    }
    .alert-info__text {
      font-family: Montserrat, sans-serif;
      font-weight: 400; font-size: 12px; line-height: 16px; color: #1E1E1E;
      flex: 1;
    }
    /* "Enviar de nuevo" — inactive (gray, timer running) / active (navy, clickable) */
    .btn-reenviar {
      background: none; border: none; padding: 0;
      font-family: Montserrat, sans-serif;
      font-weight: 700; font-size: 12px; line-height: 16px;
      text-decoration: underline;
      text-underline-offset: 2px;
      color: #969696;
      cursor: default;
      pointer-events: none;
    }
    .btn-reenviar.active {
      color: #121E6C;
      cursor: pointer;
      pointer-events: auto;
    }
    .btn-reenviar.active:active { opacity: 0.7; }

    /* ── "Editar número de celular" button ── */
    .btn-editar {
      background: none; border: none;
      font-family: Montserrat, sans-serif;
      font-weight: 700; font-size: 14px; line-height: 20px;
      color: #121E6C;
      text-decoration: underline;
      text-underline-offset: 2px;
      cursor: pointer;
      padding: 12px 0;
      text-align: left;
      align-self: flex-start;
    }
    .btn-editar:active { opacity: 0.7; }

    /* ══════════════════════════════════════
       FOOTER
       ══════════════════════════════════════ */
    .footer {
      flex-shrink: 0;
      padding: 0 16px 20px;
      background: rgba(255, 255, 255, 0.4);
      backdrop-filter: blur(10px);
    }
    .action-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .btn-text-navy {
      background: none; border: none;
      font-family: Montserrat, sans-serif;
      font-weight: 700; font-size: 14px; line-height: 20px;
      color: #121E6C;
      text-decoration: underline;
      text-underline-offset: 2px;
      cursor: pointer;
      padding: 12px 0;
    }
    .btn-text-navy:active { opacity: 0.7; }

        .kb-numeric {
      flex-shrink: 0; width: 100%; height: 290px;
      background: #D1D3D9; position: relative; overflow: hidden;
    }
    .kb-num-rows {
      position: absolute; left: 3px; right: 3px; top: 6px;
      display: flex; flex-direction: column; gap: 12px;
    }
    .kb-num-row { display: flex; gap: 6px; }
    .kb-num-key {
      flex: 1; height: 55px;
      background: #FFFFFF; border-radius: 4.6px;
      box-shadow: 0px 1px 0px 0px rgba(0,0,0,0.30);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      cursor: pointer; user-select: none; gap: 1px;
      font-family: -apple-system, 'Helvetica Neue', sans-serif;
      font-size: 22px; font-weight: 300; color: #000;
      -webkit-tap-highlight-color: transparent;
    }
    .kb-num-key:active { background: #ACB0BD; }
    .kb-num-key__sub {
      font-size: 9px; font-weight: 500; letter-spacing: 0.08em;
      color: #000; line-height: 1;
    }
    .kb-num-key--special {
      background: #ACB0BE; box-shadow: none;
    }
    .kb-num-key--special:active { background: #888D9A; }
    .kb-num-key--empty {
      background: #D1D3D9; box-shadow: none; pointer-events: none;
    }

    .kb-home {
      position: absolute; bottom: 8px; left: 50%;
      transform: translateX(-50%);
      width: 134px; height: 5px;
      background: #1C1C1E; border-radius: 3px; opacity: 0.18;
    }

    /* ══════════════════════════════════════
       AYUDA floating button
       ══════════════════════════════════════ */
    .ayuda-btn {
      position: absolute;
      top: 40px; right: 16px;
      display: flex; flex-direction: row;
      align-items: center; gap: 4px;
      padding: 8px 8px 8px 12px;
      background: #FFFFFF; border: none;
      border-radius: 100px;
      box-shadow: 0px 4px 12px 0px rgba(18, 30, 108, 0.08);
      cursor: pointer; height: 32px; z-index: 10;
    }
    .ayuda-btn__label {
      font-family: Montserrat, sans-serif;
      font-weight: 500; font-size: 14px; line-height: 20px; color: #121E6C;
    }
    .ayuda-btn__icon {
      width: 20px; height: 20px;
      display: flex; align-items: center; justify-content: center;
    }

    /* ══════════════════════════════════════
       BOTTOM SHEET – Editar número
       ══════════════════════════════════════ */
    .bs-overlay {
      position: absolute;
      inset: 0;
      background: rgba(30, 30, 30, 0.7);
      display: flex;
      align-items: flex-end;
      z-index: 200;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }
    .bs-overlay.bs-open {
      opacity: 1;
      pointer-events: auto;
    }
    .bs-sheet {
      width: 100%;
      background: #FFFFFF;
      border-radius: 32px 32px 0 0;
      padding: 12px 16px 20px;
      display: flex;
      flex-direction: column;
      gap: 24px;
      transform: translateY(100%);
      transition: transform 0.3s ease-out;
    }
    .bs-overlay.bs-open .bs-sheet {
      transform: translateY(0);
    }

    /* Drag handle */
    .bs-handle {
      width: 36px; height: 4px;
      background: #D0D3E0;
      border-radius: 2px;
      align-self: center;
      flex-shrink: 0;
    }

    /* Sheet header: chevron | title | X */
    .bs-header {
      display: flex;
      align-items: center;
      gap: 20px;
      padding: 12px 0;
    }
    .bs-btn-nav {
      width: 24px; height: 24px;
      background: none; border: none; padding: 0;
      cursor: pointer; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
    }
    .bs-btn-nav:active { opacity: 0.6; }
    .bs-title {
      font-family: Montserrat, sans-serif;
      font-weight: 700; font-size: 16px; line-height: 20px;
      color: #121E6C;
      flex: 1;
    }

    /* Input section */
    .bs-inputs {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .bs-label {
      font-family: Montserrat, sans-serif;
      font-weight: 600; font-size: 14px; line-height: 20px;
      color: #121E6C;
    }
    .bs-input-row {
      display: flex;
      gap: 8px;
    }
    .bs-country {
      background: #F7F8FB;
      border-radius: 12px;
      padding: 8px 12px;
      display: flex;
      align-items: center;
      gap: 4px;
      flex-shrink: 0;
    }
    .bs-country-flag {
      font-size: 18px; line-height: 1;
    }
    .bs-country-code {
      font-family: Montserrat, sans-serif;
      font-weight: 400; font-size: 14px; line-height: 20px;
      color: #606060;
    }
    .bs-phone-wrap {
      background: #F7F8FB;
      border-radius: 12px;
      padding: 12px 12px;
      flex: 1;
      display: flex;
      align-items: center;
      min-height: 48px;
    }
    .bs-phone-input {
      background: none; border: none; outline: none;
      font-family: Montserrat, sans-serif;
      font-weight: 500; font-size: 14px; line-height: 20px;
      color: #1E1E1E;
      width: 100%;
    }
    .bs-phone-input::placeholder { color: #A0A3B4; }

    /* Save button */
    .bs-btn-save {
      width: 100%; height: 48px;
      background: #FF2947;
      color: #FFFFFF;
      border: none;
      border-radius: 100px;
      font-family: Montserrat, sans-serif;
      font-weight: 700; font-size: 14px; line-height: 20px;
      cursor: pointer;
      transition: opacity 0.15s;
    }
    .bs-btn-save:active { opacity: 0.85; }
  
    /* ── Mobile: sin frame, pantalla completa ── */
    html.is-mobile body {
      padding: 0;
      align-items: stretch;
      background: #F7F8FB;
    }
    html.is-mobile .phone {
      width: 100% !important;
      height: 100dvh !important;
      min-height: unset !important;
      overflow-x: hidden;
    }
    html.is-mobile .footer {
      padding-bottom: env(safe-area-inset-bottom);
    }
  </style>
  <script>
    (function() {
      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent) || window.innerWidth <= 430) {
        document.documentElement.classList.add('is-mobile');
      }
    })();
  </script>
</head>
<body>

<div class="phone">

  <!-- ── HEADER ── -->
  <div class="header">
    <div class="status-bar">
      <span class="status-bar__time">1:11 PM</span>
      <div class="status-bar__right">
        <svg width="17" height="11" viewBox="0 0 17 11" fill="none" aria-hidden="true">
          <rect x="0"  y="7"    width="3.1" height="4"    rx="0.5" fill="#1E1E1E"/>
          <rect x="4"  y="5"    width="3.1" height="6"    rx="0.5" fill="#1E1E1E"/>
          <rect x="8"  y="3"    width="3.1" height="8"    rx="0.5" fill="#1E1E1E"/>
          <rect x="12" y="0.5"  width="3.1" height="10.5" rx="0.5" fill="#1E1E1E"/>
        </svg>
        <svg width="16" height="12" viewBox="0 0 16 12" fill="none" aria-hidden="true">
          <circle cx="8" cy="10.5" r="1.3" fill="#1E1E1E"/>
          <path d="M4.8 7.5C5.8 6.5 6.9 6 8 6s2.2.5 3.2 1.5"  stroke="#1E1E1E" stroke-width="1.3" stroke-linecap="round" fill="none"/>
          <path d="M2.2 5C3.7 3.4 5.8 2.5 8 2.5s4.3.9 5.8 2.5" stroke="#1E1E1E" stroke-width="1.3" stroke-linecap="round" fill="none"/>
          <path d="M0 2.5C2.1.9 4.9 0 8 0s5.9.9 8 2.5"          stroke="#1E1E1E" stroke-width="1.3" stroke-linecap="round" fill="none"/>
        </svg>
        <span class="status-bar__carrier">Carrier</span>
      </div>
    </div>

    <div class="nav-bar">
      <div class="nav-left">
        <button class="c-btn-close"
                onclick="window.location.href='../index.html?skip_location=true'"
                aria-label="Cerrar">
          <img src="../components/ic_close.svg" width="24" height="24" alt="">
        </button>
      </div>
      <div class="nav-center"></div>
      <div class="nav-right"></div>
    </div>
  </div>

  <!-- ── BODY ── -->
  <div class="body">

    <!-- Title + subtitle -->
    <div class="text-section">
      <h1 class="title">Verifica tu identidad</h1>
      <p class="subtitle" id="subtitleText">Ingresa el código que enviamos por SMS al (+51) ---.</p>
    </div>

    <!-- 6 OTP boxes -->
    <div class="pin-row" id="pinRow">
      <div class="pin-box" id="pin-0"></div>
      <div class="pin-box" id="pin-1"></div>
      <div class="pin-box" id="pin-2"></div>
      <div class="pin-box" id="pin-3"></div>
      <div class="pin-box" id="pin-4"></div>
      <div class="pin-box" id="pin-5"></div>
    </div>

    <!-- WEB/APP Alert – Info -->
    <div class="alert-info">
      <svg class="alert-info__icon" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <circle cx="10" cy="10" r="8.5" stroke="#121E6C" stroke-width="1.4"/>
        <rect x="9.3" y="8.5" width="1.4" height="5.5" rx="0.7" fill="#121E6C"/>
        <rect x="9.3" y="5.8" width="1.4" height="1.4" rx="0.7" fill="#121E6C"/>
      </svg>
      <p class="alert-info__text">
        ¿No recibiste un SMS?
        <button class="btn-reenviar" id="btnReenviar" onclick="reenviarSMS()">Enviar de nuevo</button>
        <span id="countdown">(0:60)</span>
      </p>
    </div>

    <!-- Editar número de celular -->
    <button class="btn-editar" onclick="openEditPhone()">
      Editar número de celular
    </button>

  </div><!-- /body -->

  <!-- ── FOOTER ── -->
  <div class="footer">
    <div class="action-bar">
      <button class="btn-text-navy"
              onclick="window.location.href='confirmar-clave.html'">Atrás</button>
      <button class="btn-text-navy"
              onclick="deleteKey()">Borrar</button>
    </div>
  </div>

  <!-- ── iOS NUMERIC KEYBOARD ── -->
  <div class="kb-numeric" aria-hidden="true">
    <div class="kb-num-rows">
      <div class="kb-num-row">
        <div class="kb-num-key" onclick="typeKey('1')">1<span class="kb-num-key__sub">&nbsp;</span></div>
        <div class="kb-num-key" onclick="typeKey('2')">2<span class="kb-num-key__sub">ABC</span></div>
        <div class="kb-num-key" onclick="typeKey('3')">3<span class="kb-num-key__sub">DEF</span></div>
      </div>
      <div class="kb-num-row">
        <div class="kb-num-key" onclick="typeKey('4')">4<span class="kb-num-key__sub">GHI</span></div>
        <div class="kb-num-key" onclick="typeKey('5')">5<span class="kb-num-key__sub">JKL</span></div>
        <div class="kb-num-key" onclick="typeKey('6')">6<span class="kb-num-key__sub">MNO</span></div>
      </div>
      <div class="kb-num-row">
        <div class="kb-num-key" onclick="typeKey('7')">7<span class="kb-num-key__sub">PQRS</span></div>
        <div class="kb-num-key" onclick="typeKey('8')">8<span class="kb-num-key__sub">TUV</span></div>
        <div class="kb-num-key" onclick="typeKey('9')">9<span class="kb-num-key__sub">WXYZ</span></div>

      <div class="kb-num-row">
        <div class="kb-num-key kb-num-key--empty"></div>

            <path d="M9.5 1H21C22.1 1 23 1.9 23 3V15C23 16.1 22.1 17 21 17H9.5C8.9 17 8.3 16.7 7.9 16.2L1.5 9L7.9 1.8C8.3 1.3 8.9 1 9.5 1Z" fill="none" stroke="#3C3C43" stroke-width="1.2" stroke-opacity="0.6"/>
            <path d="M15 6L11 12M11 6L15 12" stroke="#3C3C43" stroke-width="1.5" stroke-linecap="round" stroke-opacity="0.6"/>

        </div>
      </div>

    <div class="kb-home"></div>

  <!-- ── AYUDA floating button ── -->
  <button class="ayuda-btn" aria-label="Ayuda">
    <span class="ayuda-btn__label">Ayuda</span>
    <span class="ayuda-btn__icon">
      <img src="ic_ayuda_bot.svg" width="20" height="20" alt="">
    </span>
  </button>


  <!-- ── BOTTOM SHEET: Editar número de celular ── -->
  <div class="bs-overlay" id="editPhoneOverlay" onclick="handleBsClick(event)">
    <div class="bs-sheet">

      <div class="bs-handle"></div>

      <div class="bs-header">
        <button class="bs-btn-nav" onclick="closeEditPhone()" aria-label="Atrás">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
            <path d="M15 18L9 12L15 6" stroke="#121E6C" stroke-width="2"
                  stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
        <span class="bs-title">Editar número de celular</span>
        <button class="bs-btn-nav" onclick="closeEditPhone()" aria-label="Cerrar">
          <img src="../components/ic_close.svg" width="24" height="24" alt="">
        </button>
      </div>

      <div class="bs-inputs">
        <span class="bs-label">Número de celular</span>
        <div class="bs-input-row">
          <div class="bs-country">
            <span class="bs-country-flag">🇵🇪</span>
            <span class="bs-country-code">+51</span>
          </div>
          <div class="bs-phone-wrap">
            <input type="tel"
                   class="bs-phone-input"
                   id="editPhoneInput"
                   maxlength="9"
                   placeholder="--- --- ---">
          </div>
        </div>
      </div>

      <div>
        <button class="bs-btn-save" onclick="savePhone()">Guardar</button>
      </div>

    </div>
  </div>

</div><!-- /phone -->

<script>
  /* ── Phone number from previous screen ── */
  function formatPhone(raw) {
    const digits = (raw || '').replace(/\D/g, '');
    if (digits.length >= 9) {
      return `(+51) ${digits.slice(0,3)} ${digits.slice(3,6)} ${digits.slice(6,9)}`;
    }
    return digits ? `(+51) ${digits}` : '(+51) ---';
  }

  const phone = localStorage.getItem('celular') || '';
  document.getElementById('subtitleText').textContent =
    `Ingresa el código que enviamos por SMS al ${formatPhone(phone)}.`;

  /* ── OTP state ── */
  let otpValue = '';

  function updateDisplay() {
    const p = otpValue;
    const boxes = document.querySelectorAll('.pin-box');
    boxes.forEach((box, i) => {
      box.classList.remove('pin-box--active', 'pin-box--filled');
      if (i < p.length) {
        box.classList.add('pin-box--filled');
      } else if (i === p.length) {
        box.classList.add('pin-box--active');
      }
    });
  }

  function typeKey(digit) {
    if (otpValue.length >= 6) return;
    otpValue += digit;
    updateDisplay();
    if (otpValue.length === 6) {
      /* Any 6-digit code is valid in this prototype */
      setTimeout(() => {
        window.location.href = 'biometria.html';
      }, 120);
    }
  }

  function deleteKey() {
    if (otpValue.length > 0) {
      otpValue = otpValue.slice(0, -1);
      updateDisplay();
    }
  }

  /* Physical keyboard support for desktop testing (only when sheet is closed) */
  document.addEventListener('keydown', e => {
    if (document.getElementById('editPhoneOverlay').classList.contains('bs-open')) return;
    if (e.key >= '0' && e.key <= '9') typeKey(e.key);
    else if (e.key === 'Backspace') deleteKey();
  });

  /* ── Countdown timer ── */
  let timerSecs = 60;
  let timerInterval = null;

  function startCountdown() {
    timerInterval = setInterval(() => {
      timerSecs--;
      const s = timerSecs.toString().padStart(2, '0');
      document.getElementById('countdown').textContent = `(0:${s})`;
      if (timerSecs <= 0) {
        clearInterval(timerInterval);
        document.getElementById('btnReenviar').classList.add('active');
      }
    }, 1000);
  }

  function reenviarSMS() {
    timerSecs = 60;
    document.getElementById('countdown').textContent = '(0:60)';
    document.getElementById('btnReenviar').classList.remove('active');
    startCountdown();
  }

  window.addEventListener('load', () => {
    updateDisplay();
    startCountdown();
  });

  /* ── Bottom sheet: edit phone number ── */
  function openEditPhone() {
    const input = document.getElementById('editPhoneInput');
    input.value = localStorage.getItem('celular') || '';
    document.getElementById('editPhoneOverlay').classList.add('bs-open');
    setTimeout(() => input.focus(), 320);
  }

  function closeEditPhone() {
    document.getElementById('editPhoneOverlay').classList.remove('bs-open');
  }

  function handleBsClick(e) {
    if (e.target === document.getElementById('editPhoneOverlay')) closeEditPhone();
  }

  function savePhone() {
    const raw = document.getElementById('editPhoneInput').value.replace(/\D/g, '');
    if (!raw) return;
    localStorage.setItem('celular', raw);
    document.getElementById('subtitleText').textContent =
      `Ingresa el código que enviamos por SMS al ${formatPhone(raw)}.`;
    closeEditPhone();
  }
</script>

</body>
</html>
