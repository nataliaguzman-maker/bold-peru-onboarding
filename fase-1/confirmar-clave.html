<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Bold – Confirmar clave</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Roboto:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../components/shared.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #D0D3E0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 40px 0;
      min-height: 100vh;
    }

    /* ── Phone shell: 393 × 852 ── */
    .phone {
      width: 393px;
      height: 852px;
      background: #F7F8FB;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .header, .body, .footer, .keyboard, .ayuda-btn {
      position: relative;
      z-index: 1;
    }

    /* ══════════════════════════════════════
       HEADER
       ══════════════════════════════════════ */
    .header {
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      gap: 20px;
      padding-bottom: 16px;
    }

    .status-bar {
      height: 20px;
      position: relative;
      display: flex;
      align-items: center;
      padding: 0 8px;
    }
    .status-bar__time {
      position: absolute; left: 50%; top: 50%;
      transform: translate(-50%, -50%);
      font-family: Roboto, sans-serif;
      font-weight: 600; font-size: 12px; color: #1E1E1E; line-height: 1;
    }
    .status-bar__right {
      position: absolute; right: 5px; top: 50%;
      transform: translateY(-50%);
      display: flex; align-items: center; gap: 4px;
    }
    .status-bar__carrier {
      font-family: Roboto, sans-serif;
      font-weight: 400; font-size: 12px;
      letter-spacing: -0.0014em; color: #1E1E1E; line-height: 1;
    }

    .nav-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 12px;
    }
    .nav-left  { width: 102px; display: flex; align-items: center; }
    .nav-center { flex: 1; }
    .nav-right  { width: 102px; display: flex; justify-content: flex-end; }

    /* ══════════════════════════════════════
       BODY
       ══════════════════════════════════════ */
    .body {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 40px;
      padding: 0 16px;
      scrollbar-width: none;
    }
    .body::-webkit-scrollbar { display: none; }

    .text-section {
      display: flex;
      flex-direction: column;
      gap: 12px;
      align-self: stretch;
    }
    .title {
      font-family: Montserrat, sans-serif;
      font-weight: 600; font-size: 20px; line-height: 24px; color: #1E1E1E;
    }
    .subtitle {
      font-family: Montserrat, sans-serif;
      font-weight: 400; font-size: 14px; line-height: 20px; color: #1E1E1E;
    }

    /* ── PIN ── */
    .pin-section {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .pin-row {
      display: flex;
      justify-content: center;
      gap: 8px;
    }
    .pin-box {
      width: 48px; height: 48px;
      border-radius: 12px;
      border: 1px solid #D2D4E1;
      background: #FFFFFF;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: border-color 0.15s;
    }
    .pin-box--active {
      border: 1.5px solid #121E6C;
    }
    .pin-box--active::after {
      content: '';
      width: 1.5px; height: 22px;
      background: #121E6C;
      border-radius: 1px;
      animation: pin-blink 1.1s step-end infinite;
    }
    @keyframes pin-blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
    .pin-box--filled::after {
      content: '';
      width: 10px; height: 10px;
      border-radius: 50%;
      background: #1E1E1E;
    }
    .pin-box--error {
      border: 1.5px solid #910022 !important;
    }
    .pin-box--error.pin-box--filled::after {
      background: #910022;
    }
    .pin-error-msg {
      font-family: Montserrat, sans-serif;
      font-weight: 400; font-size: 14px; line-height: 20px;
      color: #910022;
      text-align: center;
      display: none;
    }
    .pin-error-msg.c-visible { display: block; }

    /* ══════════════════════════════════════
       FOOTER
       ══════════════════════════════════════ */
    .footer {
      flex-shrink: 0;
      padding: 0 16px 20px;
      background: rgba(255, 255, 255, 0.4);
      backdrop-filter: blur(10px);
    }
    .action-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .btn-text-navy {
      background: none; border: none;
      font-family: Montserrat, sans-serif;
      font-weight: 700; font-size: 14px; line-height: 20px;
      color: #121E6C;
      text-decoration: underline;
      text-underline-offset: 2px;
      cursor: pointer;
      padding: 12px 0;
    }
    .btn-text-navy:active { opacity: 0.7; }

        .kb-numeric {
      flex-shrink: 0; width: 100%; height: 290px;
      background: #D1D3D9; position: relative; overflow: hidden;
    }
    .kb-num-rows {
      position: absolute; left: 3px; right: 3px; top: 6px;
      display: flex; flex-direction: column; gap: 12px;
    }
    .kb-num-row { display: flex; gap: 6px; }
    .kb-num-key {
      flex: 1; height: 55px;
      background: #FFFFFF; border-radius: 4.6px;
      box-shadow: 0px 1px 0px 0px rgba(0,0,0,0.30);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      cursor: pointer; user-select: none; gap: 1px;
      font-family: -apple-system, 'Helvetica Neue', sans-serif;
      font-size: 22px; font-weight: 300; color: #000;
      -webkit-tap-highlight-color: transparent;
    }
    .kb-num-key:active { background: #ACB0BD; }
    .kb-num-key__sub {
      font-size: 9px; font-weight: 500; letter-spacing: 0.08em;
      color: #000; line-height: 1;
    }
    .kb-num-key--special {
      background: #ACB0BE; box-shadow: none;
    }
    .kb-num-key--special:active { background: #888D9A; }
    .kb-num-key--empty {
      background: #D1D3D9; box-shadow: none; pointer-events: none;
    }

    .kb-home {
      position: absolute; bottom: 8px; left: 50%;
      transform: translateX(-50%);
      width: 134px; height: 5px;
      background: #1C1C1E; border-radius: 3px; opacity: 0.18;
    }

    /* ══════════════════════════════════════
       AYUDA floating button
       ══════════════════════════════════════ */
    .ayuda-btn {
      position: absolute;
      top: 40px; right: 16px;
      display: flex; flex-direction: row;
      align-items: center; gap: 4px;
      padding: 8px 8px 8px 12px;
      background: #FFFFFF; border: none;
      border-radius: 100px;
      box-shadow: 0px 4px 12px 0px rgba(18, 30, 108, 0.08);
      cursor: pointer; height: 32px; z-index: 10;
    }
    .ayuda-btn__label {
      font-family: Montserrat, sans-serif;
      font-weight: 500; font-size: 14px; line-height: 20px; color: #121E6C;
    }
    .ayuda-btn__icon {
      width: 20px; height: 20px;
      display: flex; align-items: center; justify-content: center;
    }
  
    /* ── Mobile: sin frame, pantalla completa ── */
    html.is-mobile body {
      padding: 0;
      align-items: stretch;
      background: #F7F8FB;
    }
    html.is-mobile .phone {
      width: 100% !important;
      height: 100dvh !important;
      min-height: unset !important;
      overflow-x: hidden;
    }
    html.is-mobile .footer {
      padding-bottom: env(safe-area-inset-bottom);
    }
  </style>
  <script>
    (function() {
      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent) || window.innerWidth <= 430) {
        document.documentElement.classList.add('is-mobile');
      }
    })();
  </script>
</head>
<body>

<div class="phone">

  <!-- ── HEADER ── -->
  <div class="header">
    <div class="status-bar">
      <span class="status-bar__time">1:11 PM</span>
      <div class="status-bar__right">
        <svg width="17" height="11" viewBox="0 0 17 11" fill="none" aria-hidden="true">
          <rect x="0"  y="7"    width="3.1" height="4"    rx="0.5" fill="#1E1E1E"/>
          <rect x="4"  y="5"    width="3.1" height="6"    rx="0.5" fill="#1E1E1E"/>
          <rect x="8"  y="3"    width="3.1" height="8"    rx="0.5" fill="#1E1E1E"/>
          <rect x="12" y="0.5"  width="3.1" height="10.5" rx="0.5" fill="#1E1E1E"/>
        </svg>
        <svg width="16" height="12" viewBox="0 0 16 12" fill="none" aria-hidden="true">
          <circle cx="8" cy="10.5" r="1.3" fill="#1E1E1E"/>
          <path d="M4.8 7.5C5.8 6.5 6.9 6 8 6s2.2.5 3.2 1.5"  stroke="#1E1E1E" stroke-width="1.3" stroke-linecap="round" fill="none"/>
          <path d="M2.2 5C3.7 3.4 5.8 2.5 8 2.5s4.3.9 5.8 2.5" stroke="#1E1E1E" stroke-width="1.3" stroke-linecap="round" fill="none"/>
          <path d="M0 2.5C2.1.9 4.9 0 8 0s5.9.9 8 2.5"          stroke="#1E1E1E" stroke-width="1.3" stroke-linecap="round" fill="none"/>
        </svg>
        <span class="status-bar__carrier">Carrier</span>
      </div>
    </div>

    <div class="nav-bar">
      <div class="nav-left">
        <button class="c-btn-close"
                onclick="window.location.href='../index.html?skip_location=true'"
                aria-label="Cerrar">
          <img src="../components/ic_close.svg" width="24" height="24" alt="">
        </button>
      </div>
      <div class="nav-center"></div>
      <div class="nav-right"></div>
    </div>
  </div>

  <!-- ── BODY ── -->
  <div class="body">

    <div class="text-section">
      <h1 class="title">Ahora confirma tu clave</h1>
      <p class="subtitle">Reingresa la clave de 6 dígitos que usarás para acceder a la App Bold y al panel de comercios.</p>
    </div>

    <!-- PIN boxes + error message -->
    <div class="pin-section">
      <div class="pin-row" id="pinRow">
        <div class="pin-box" id="pin-0"></div>
        <div class="pin-box" id="pin-1"></div>
        <div class="pin-box" id="pin-2"></div>
        <div class="pin-box" id="pin-3"></div>
        <div class="pin-box" id="pin-4"></div>
        <div class="pin-box" id="pin-5"></div>
      </div>
      <p class="pin-error-msg" id="pinErrorMsg">Las claves no coinciden. Inténtalo de nuevo.</p>
    </div>

  </div><!-- /body -->

  <!-- ── FOOTER ── -->
  <div class="footer">
    <div class="action-bar">
      <button class="btn-text-navy"
              onclick="window.location.href='clave.html'">Atrás</button>
      <button class="btn-text-navy"
              onclick="deleteKey()">Borrar</button>
    </div>
  </div>

  <!-- ── iOS NUMERIC KEYBOARD ── -->
  <div class="kb-numeric" aria-hidden="true">
    <div class="kb-num-rows">
      <div class="kb-num-row">
        <div class="kb-num-key" onclick="typeKey('1')">1<span class="kb-num-key__sub">&nbsp;</span></div>
        <div class="kb-num-key" onclick="typeKey('2')">2<span class="kb-num-key__sub">ABC</span></div>
        <div class="kb-num-key" onclick="typeKey('3')">3<span class="kb-num-key__sub">DEF</span></div>
      </div>
      <div class="kb-num-row">
        <div class="kb-num-key" onclick="typeKey('4')">4<span class="kb-num-key__sub">GHI</span></div>
        <div class="kb-num-key" onclick="typeKey('5')">5<span class="kb-num-key__sub">JKL</span></div>
        <div class="kb-num-key" onclick="typeKey('6')">6<span class="kb-num-key__sub">MNO</span></div>
      </div>
      <div class="kb-num-row">
        <div class="kb-num-key" onclick="typeKey('7')">7<span class="kb-num-key__sub">PQRS</span></div>
        <div class="kb-num-key" onclick="typeKey('8')">8<span class="kb-num-key__sub">TUV</span></div>
        <div class="kb-num-key" onclick="typeKey('9')">9<span class="kb-num-key__sub">WXYZ</span></div>
      </div>
      <div class="kb-num-row">
        <div class="kb-num-key kb-num-key--empty"></div>
        <div class="kb-num-key" onclick="typeKey('0')">0</div>
        <div class="kb-num-key kb-num-key--special" onclick="deleteKey()">
          <svg width="20" height="15" viewBox="0 0 24 18" fill="none">
            <path d="M9.5 1H21C22.1 1 23 1.9 23 3V15C23 16.1 22.1 17 21 17H9.5C8.9 17 8.3 16.7 7.9 16.2L1.5 9L7.9 1.8C8.3 1.3 8.9 1 9.5 1Z" fill="none" stroke="#3C3C43" stroke-width="1.2" stroke-opacity="0.6"/>
            <path d="M15 6L11 12M11 6L15 12" stroke="#3C3C43" stroke-width="1.5" stroke-linecap="round" stroke-opacity="0.6"/>
          </svg>
        </div>
      </div>
    </div>
    <div class="kb-home"></div>
  </div>

  <!-- ── AYUDA floating button ── -->
  <button class="ayuda-btn" aria-label="Ayuda">
    <span class="ayuda-btn__label">Ayuda</span>
    <span class="ayuda-btn__icon">
      <img src="ic_ayuda_bot.svg" width="20" height="20" alt="">
    </span>
  </button>

</div><!-- /phone -->

<script>
  /* PIN created in the previous screen */
  const createdPin = sessionStorage.getItem('bold_pin') || '';

  let pinValue = '';
  let hasError = false;

  function updatePinDisplay() {
    const p = pinValue;
    const boxes = document.querySelectorAll('.pin-box');
    const errorMsg = document.getElementById('pinErrorMsg');

    boxes.forEach((box, i) => {
      box.classList.remove('pin-box--active', 'pin-box--filled', 'pin-box--error');
      if (i < p.length) {
        box.classList.add('pin-box--filled');
        if (hasError) box.classList.add('pin-box--error');
      } else if (i === p.length && !hasError) {
        box.classList.add('pin-box--active');
      }
    });

    errorMsg.classList.toggle('c-visible', hasError);
  }

  function typeKey(digit) {
    if (hasError) {
      /* Start fresh after a mismatch */
      hasError = false;
      pinValue = digit;
      updatePinDisplay();
      return;
    }
    if (pinValue.length >= 6) return;
    pinValue += digit;
    updatePinDisplay();
    if (pinValue.length === 6) checkPin();
  }

  function deleteKey() {
    if (hasError) {
      /* Reset everything on delete after error */
      hasError = false;
      pinValue = '';
      updatePinDisplay();
      return;
    }
    if (pinValue.length > 0) {
      pinValue = pinValue.slice(0, -1);
      updatePinDisplay();
    }
  }

  function checkPin() {
    if (pinValue === createdPin) {
      /* Match — advance to OTP verification */
      window.location.href = 'otp.html';
    } else {
      hasError = true;
      updatePinDisplay();
    }
  }

  /* Physical keyboard support for desktop testing */
  document.addEventListener('keydown', e => {
    if (e.key >= '0' && e.key <= '9') typeKey(e.key);
    else if (e.key === 'Backspace') deleteKey();
  });

  window.addEventListener('load', updatePinDisplay);
</script>

</body>
</html>
