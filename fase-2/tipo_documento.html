<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Bold – Tipo de documento</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Roboto:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../components/shared.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #D0D3E0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 40px 0;
      min-height: 100vh;
    }

    /* ── Phone shell: 393 × 852 ── */
    .phone {
      width: 393px;
      height: 852px;
      background: #F7F8FB;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    /* ══════════════════════════════════════
       HEADER
       ══════════════════════════════════════ */
    .header {
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      gap: 20px;
      padding-bottom: 16px;
    }

    .status-bar {
      height: 20px;
      position: relative;
      display: flex;
      align-items: center;
      padding: 0 8px;
    }
    .status-bar__time {
      position: absolute; left: 50%; top: 50%;
      transform: translate(-50%, -50%);
      font-family: Roboto, sans-serif;
      font-weight: 600; font-size: 12px; color: #1E1E1E; line-height: 1;
    }
    .status-bar__right {
      position: absolute; right: 5px; top: 50%;
      transform: translateY(-50%);
      display: flex; align-items: center; gap: 4px;
    }
    .status-bar__carrier {
      font-family: Roboto, sans-serif;
      font-weight: 400; font-size: 12px;
      letter-spacing: -0.0014em; color: #1E1E1E; line-height: 1;
    }

    .nav-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 12px;
    }
    .nav-left  { width: 102px; display: flex; align-items: center; }
    .nav-center { flex: 1; }
    .nav-right  { width: 102px; display: flex; justify-content: flex-end; }

    /* ══════════════════════════════════════
       BODY
       ══════════════════════════════════════ */
    .body {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 32px;
      padding: 0 16px;
      overflow: hidden;
    }

    .text-section {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .title {
      font-family: Montserrat, sans-serif;
      font-weight: 600; font-size: 20px; line-height: 24px; color: #1E1E1E;
    }
    .subtitle {
      font-family: Montserrat, sans-serif;
      font-weight: 400; font-size: 14px; line-height: 20px; color: #1E1E1E;
    }

    .options-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    /* ══════════════════════════════════════
       FOOTER
       ══════════════════════════════════════ */
    .footer {
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      gap: 20px;
      padding: 0 16px 20px;
    }

    /* Barra de progreso (estructura idéntica al checkpoint) */
    .progress-bar {
      display: flex;
      gap: 8px;
    }
    .progress-bar__seg {
      flex: 1;
      height: 2px;
      border-radius: 1px;
      background: #D2D4E1;
      position: relative;
      overflow: hidden;
    }
    .progress-bar__fill {
      position: absolute;
      left: 0; top: 0;
      height: 100%;
      background: #FF2947;
      border-radius: 1px;
    }

    .action-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .btn-continuar {
      width: 140px;
    }

    /* ══════════════════════════════════════
       AYUDA (floating)
       ══════════════════════════════════════ */
    .ayuda-btn {
      position: absolute;
      top: 40px; right: 16px;
      display: flex; flex-direction: row;
      align-items: center; gap: 4px;
      padding: 8px 8px 8px 12px;
      background: #FFFFFF; border: none;
      border-radius: 100px;
      box-shadow: 0px 4px 12px 0px rgba(18, 30, 108, 0.08);
      cursor: pointer; height: 32px; z-index: 10;
    }
    .ayuda-btn__label {
      font-family: Montserrat, sans-serif;
      font-weight: 500; font-size: 14px; line-height: 20px; color: #121E6C;
    }
    .ayuda-btn__icon {
      width: 20px; height: 20px;
      display: flex; align-items: center; justify-content: center;
    }
  
    /* ── Mobile: sin frame, pantalla completa ── */
    html.is-mobile body {
      padding: 0;
      align-items: stretch;
      background: #F7F8FB;
    }
    html.is-mobile .phone {
      width: 100% !important;
      height: 100dvh !important;
      min-height: unset !important;
      overflow-x: hidden;
    }
    html.is-mobile .footer {
      padding-bottom: env(safe-area-inset-bottom);
    }
  </style>
  <script>
    (function() {
      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent) || window.innerWidth <= 430) {
        document.documentElement.classList.add('is-mobile');
      }
    })();
  </script>
</head>
<body>

<div class="phone">

  <!-- ── HEADER ── -->
  <div class="header">
    <div class="status-bar">
      <span class="status-bar__time">1:11 PM</span>
      <div class="status-bar__right">
        <svg width="17" height="11" viewBox="0 0 17 11" fill="none" aria-hidden="true">
          <rect x="0"  y="7"    width="3.1" height="4"    rx="0.5" fill="#1E1E1E"/>
          <rect x="4"  y="5"    width="3.1" height="6"    rx="0.5" fill="#1E1E1E"/>
          <rect x="8"  y="3"    width="3.1" height="8"    rx="0.5" fill="#1E1E1E"/>
          <rect x="12" y="0.5"  width="3.1" height="10.5" rx="0.5" fill="#1E1E1E"/>
        </svg>
        <svg width="16" height="12" viewBox="0 0 16 12" fill="none" aria-hidden="true">
          <circle cx="8" cy="10.5" r="1.3" fill="#1E1E1E"/>
          <path d="M4.8 7.5C5.8 6.5 6.9 6 8 6s2.2.5 3.2 1.5"  stroke="#1E1E1E" stroke-width="1.3" stroke-linecap="round" fill="none"/>
          <path d="M2.2 5C3.7 3.4 5.8 2.5 8 2.5s4.3.9 5.8 2.5" stroke="#1E1E1E" stroke-width="1.3" stroke-linecap="round" fill="none"/>
          <path d="M0 2.5C2.1.9 4.9 0 8 0s5.9.9 8 2.5"          stroke="#1E1E1E" stroke-width="1.3" stroke-linecap="round" fill="none"/>
        </svg>
        <span class="status-bar__carrier">Carrier</span>
      </div>
    </div>
    <div class="nav-bar">
      <div class="nav-left">
        <button class="c-btn-close"
                onclick="window.location.href='../index.html?skip_location=true'"
                aria-label="Cerrar">
          <img src="../components/ic_close.svg" width="24" height="24" alt="">
        </button>
      </div>
      <div class="nav-center"></div>
      <div class="nav-right"></div>
    </div>
  </div>

  <!-- ── BODY ── -->
  <div class="body">

    <div class="text-section">
      <h1 class="title">Primero, selecciona el tipo de documento de identidad</h1>
      <p class="subtitle">Puedes registrarte como persona natural o empresa.</p>
    </div>

    <div class="options-list" role="radiogroup" aria-label="Tipo de documento">
      <button class="c-sel-item" data-value="dni"
              onclick="selectItem(this)" aria-pressed="false">
        DNI (Documento Nacional de Identidad)
      </button>
      <button class="c-sel-item" data-value="ce"
              onclick="selectItem(this)" aria-pressed="false">
        CE (Carné de Extranjería)
      </button>
      <button class="c-sel-item" data-value="ruc"
              onclick="selectItem(this)" aria-pressed="false">
        RUC (Registro Único de Contribuyentes)
      </button>
    </div>

  </div><!-- /body -->

  <!-- ── FOOTER ── -->
  <div class="footer">

    <!-- Barra de progreso: segmento 1 al 2/3 -->
    <div class="progress-bar" role="progressbar" aria-label="Paso 1 de 3, pantalla 2 de 3">
      <div class="progress-bar__seg">
        <div class="progress-bar__fill" style="width: 66.67%"></div>
      </div>
      <div class="progress-bar__seg"></div>
      <div class="progress-bar__seg"></div>
    </div>

    <div class="action-bar">
      <button class="c-btn-text c-btn-text--active"
              onclick="window.location.href='checkpoint-1.html'">
        Atrás
      </button>
      <button class="c-btn-primary btn-continuar"
              id="btnContinuar"
              disabled
              onclick="goNext()">
        Continuar
      </button>
    </div>

  </div><!-- /footer -->

  <!-- ── AYUDA ── -->
  <button class="ayuda-btn" aria-label="Ayuda">
    <span class="ayuda-btn__label">Ayuda</span>
    <span class="ayuda-btn__icon">
      <img src="../fase-1/ic_ayuda_bot.svg" width="20" height="20" alt="">
    </span>
  </button>

</div><!-- /phone -->

<script>
  function selectItem(el) {
    document.querySelectorAll('.c-sel-item').forEach(btn => {
      btn.classList.remove('c-sel-item--selected');
      btn.setAttribute('aria-pressed', 'false');
    });
    el.classList.add('c-sel-item--selected');
    el.setAttribute('aria-pressed', 'true');
    document.getElementById('btnContinuar').disabled = false;
  }

  function goNext() {
    const sel = document.querySelector('.c-sel-item--selected');
    if (sel) localStorage.setItem('tipo_documento', sel.dataset.value);
    window.location.href = 'numero_documento.html';
  }
</script>

</body>
</html>
