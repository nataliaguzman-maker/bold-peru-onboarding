<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Bold – Número de documento</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Roboto:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../components/shared.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #D0D3E0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 40px 0;
      min-height: 100vh;
    }

    @media (max-width: 430px) {
      body {
        padding: 0;
        min-height: 100dvh;
      }
    }

    /* ── Phone shell ── */
    .phone {
      width: 393px;
      height: 100dvh;
      background: #F7F8FB;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    @media (max-width: 430px) {
      .phone {
        width: 100%;
        height: 100dvh;
        border-radius: 0;
        box-shadow: none;
      }
    }

    /* ══════════════════════════════════════
       HEADER
       ══════════════════════════════════════ */
    .header {
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      gap: 20px;
      padding-bottom: 16px;
    }

    .status-bar {
      height: 20px;
      position: relative;
      display: flex;
      align-items: center;
      padding: 0 8px;
    }
    .status-bar__time {
      position: absolute; left: 50%; top: 50%;
      transform: translate(-50%, -50%);
      font-family: Roboto, sans-serif;
      font-weight: 600; font-size: 12px; color: #1E1E1E; line-height: 1;
    }
    .status-bar__right {
      position: absolute; right: 5px; top: 50%;
      transform: translateY(-50%);
      display: flex; align-items: center; gap: 4px;
    }
    .status-bar__carrier {
      font-family: Roboto, sans-serif;
      font-weight: 400; font-size: 12px;
      letter-spacing: -0.0014em; color: #1E1E1E; line-height: 1;
    }

    .nav-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 12px;
    }
    .nav-left  { width: 102px; display: flex; align-items: center; }
    .nav-center { flex: 1; }
    .nav-right  { width: 102px; display: flex; justify-content: flex-end; }

    /* ══════════════════════════════════════
       BODY
       ══════════════════════════════════════ */
    .body {
      flex: 1;
      height: 100%;
      display: flex;
      flex-direction: column;
      gap: 32px;
      padding: 0 16px;
      overflow-y: auto;
      scrollbar-width: none;
    }
    .body::-webkit-scrollbar { display: none; }

    .text-section {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .title {
      font-family: Montserrat, sans-serif;
      font-weight: 600; font-size: 20px; line-height: 24px; color: #1E1E1E;
    }
    .subtitle {
      font-family: Montserrat, sans-serif;
      font-weight: 400; font-size: 14px; line-height: 20px; color: #1E1E1E;
    }

    .form-section {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* ══════════════════════════════════════
       FOOTER
       ══════════════════════════════════════ */
    .footer {
      flex-shrink: 0;
      margin-top: auto;
      display: flex;
      flex-direction: column;
      gap: 20px;
      padding: 0 16px 20px;
    }

    .progress-bar {
      display: flex;
      gap: 8px;
    }
    .progress-bar__seg {
      flex: 1;
      height: 2px;
      border-radius: 1px;
      background: #D2D4E1;
      position: relative;
      overflow: hidden;
    }
    .progress-bar__fill {
      position: absolute;
      left: 0; top: 0;
      height: 100%;
      background: #FF2947;
      border-radius: 1px;
    }

    .action-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .btn-continuar {
      width: 140px;
    }

    /* ══════════════════════════════════════
       AYUDA (floating)
       ══════════════════════════════════════ */
    .ayuda-btn {
      position: absolute;
      top: 40px; right: 16px;
      display: flex; flex-direction: row;
      align-items: center; gap: 4px;
      padding: 8px 8px 8px 12px;
      background: #FFFFFF; border: none;
      border-radius: 100px;
      box-shadow: 0px 4px 12px 0px rgba(18, 30, 108, 0.08);
      cursor: pointer; height: 32px; z-index: 10;
    }
    .ayuda-btn__label {
      font-family: Montserrat, sans-serif;
      font-weight: 500; font-size: 14px; line-height: 20px; color: #121E6C;
    }
    .ayuda-btn__icon {
      width: 20px; height: 20px;
      display: flex; align-items: center; justify-content: center;
    }
  </style>
</head>
<body>

<div class="phone">

  <!-- ── HEADER ── -->
  <div class="header">
    <div class="status-bar">
      <span class="status-bar__time">1:11 PM</span>
      <div class="status-bar__right">
        <svg width="17" height="11" viewBox="0 0 17 11" fill="none" aria-hidden="true">
          <rect x="0"  y="7"    width="3.1" height="4"    rx="0.5" fill="#1E1E1E"/>
          <rect x="4"  y="5"    width="3.1" height="6"    rx="0.5" fill="#1E1E1E"/>
          <rect x="8"  y="3"    width="3.1" height="8"    rx="0.5" fill="#1E1E1E"/>
          <rect x="12" y="0.5"  width="3.1" height="10.5" rx="0.5" fill="#1E1E1E"/>
        </svg>
        <svg width="16" height="12" viewBox="0 0 16 12" fill="none" aria-hidden="true">
          <circle cx="8" cy="10.5" r="1.3" fill="#1E1E1E"/>
          <path d="M4.8 7.5C5.8 6.5 6.9 6 8 6s2.2.5 3.2 1.5"  stroke="#1E1E1E" stroke-width="1.3" stroke-linecap="round" fill="none"/>
          <path d="M2.2 5C3.7 3.4 5.8 2.5 8 2.5s4.3.9 5.8 2.5" stroke="#1E1E1E" stroke-width="1.3" stroke-linecap="round" fill="none"/>
          <path d="M0 2.5C2.1.9 4.9 0 8 0s5.9.9 8 2.5"          stroke="#1E1E1E" stroke-width="1.3" stroke-linecap="round" fill="none"/>
        </svg>
        <span class="status-bar__carrier">Carrier</span>
      </div>
    </div>
    <div class="nav-bar">
      <div class="nav-left">
        <button class="c-btn-close"
                onclick="window.location.href='../index.html?skip_location=true'"
                aria-label="Cerrar">
          <img src="../components/ic_close.svg" width="24" height="24" alt="">
        </button>
      </div>
      <div class="nav-center"></div>
      <div class="nav-right"></div>
    </div>
  </div>

  <!-- ── BODY ── -->
  <div class="body">

    <div class="text-section">
      <h1 class="title">¿Cuál es tu número de documento?</h1>
      <p class="subtitle">Lo usaremos únicamente para verificar tu identidad.</p>
    </div>

    <div class="form-section">

      <!-- Input de número de documento -->
      <div class="c-form-group">
        <label class="c-input-label" for="inputDocumento" id="labelDocumento">Número de documento</label>
        <input class="c-input-field" type="text" id="inputDocumento"
               inputmode="numeric"
               autocorrect="off"
               autocapitalize="none"
               placeholder="Ej. 12345678"
               autofocus
               oninput="checkForm()"
               aria-labelledby="labelDocumento">
      </div>

      <!-- Checkbox mayoría de edad -->
      <label class="c-checkbox-label">
        <input type="checkbox" class="c-checkbox-native" id="checkMayor"
               onchange="checkForm()">
        <span class="c-checkbox-visual">
          <span class="c-checkbox-mark"></span>
        </span>
        Soy mayor de 18 años.
      </label>

      <!-- Alerta informativa -->
      <div class="c-alert-info" role="note">
        <svg class="c-alert-info__icon" viewBox="0 0 20 20" fill="none" aria-hidden="true">
          <circle cx="10" cy="10" r="9" stroke="#227AD1" stroke-width="1.5"/>
          <rect x="9.25" y="8.5" width="1.5" height="5.5" rx="0.75" fill="#227AD1"/>
          <circle cx="10" cy="6.5" r="0.85" fill="#227AD1"/>
        </svg>
        <p class="c-alert-info__text">
          Debes ser mayor de edad para crear una cuenta en Bold.
        </p>
      </div>

    </div>

  </div><!-- /body -->

  <!-- ── FOOTER ── -->
  <div class="footer">

    <div class="progress-bar" role="progressbar" aria-label="Paso 1 de 3, pantalla 2 de 3">
      <div class="progress-bar__seg">
        <div class="progress-bar__fill" style="width: 66.67%"></div>
      </div>
      <div class="progress-bar__seg"></div>
      <div class="progress-bar__seg"></div>
    </div>

    <div class="action-bar">
      <button class="c-btn-text c-btn-text--active"
              onclick="window.location.href='tipo_documento.html'">
        Atrás
      </button>
      <button class="c-btn-primary btn-continuar"
              id="btnContinuar"
              disabled
              onclick="goNext()">
        Continuar
      </button>
    </div>

  </div><!-- /footer -->

  <!-- ── AYUDA ── -->
  <button class="ayuda-btn" aria-label="Ayuda">
    <span class="ayuda-btn__label">Ayuda</span>
    <span class="ayuda-btn__icon">
      <img src="../fase-1/ic_ayuda_bot.svg" width="20" height="20" alt="">
    </span>
  </button>

</div><!-- /phone -->

<script>
  const DOC_LABELS = {
    dni: 'Número de DNI',
    ce:  'Número de CE',
    ruc: 'Número de RUC'
  };

  const input = document.getElementById('inputDocumento');

  window.addEventListener('load', () => {
    const type = localStorage.getItem('tipo_documento');
    if (type && DOC_LABELS[type]) {
      document.getElementById('labelDocumento').textContent = DOC_LABELS[type];
      const placeholders = { dni: 'Ej. 12345678', ce: 'Ej. 000123456', ruc: 'Ej. 20123456789' };
      input.placeholder = placeholders[type] || 'Ej. 12345678';
    }
    input.focus();
  });

  function checkForm() {
    const filled  = input.value.trim().length > 0;
    const checked = document.getElementById('checkMayor').checked;
    document.getElementById('btnContinuar').disabled = !(filled && checked);
  }

  function goNext() {
    localStorage.setItem('numero_documento', input.value.trim());
    window.location.href = 'nombres.html';
  }
</script>

</body>
</html>
