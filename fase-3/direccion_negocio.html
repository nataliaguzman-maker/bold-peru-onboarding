<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Bold – Dirección del negocio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Roboto:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../components/shared.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #D0D3E0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 40px 0;
      min-height: 100vh;
    }

    @media (max-width: 430px) {
      body {
        padding: 0;
        min-height: 100dvh;
      }
    }

    /* ── Phone shell ── */
    .phone {
      width: 393px;
      height: 100dvh;
      background: #F7F8FB;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    @media (max-width: 430px) {
      .phone {
        width: 100%;
        height: 100dvh;
        border-radius: 0;
        box-shadow: none;
      }
    }

    /* ══ HEADER ══ */
    .header {
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      gap: 20px;
      padding-bottom: 16px;
    }
    .status-bar {
      height: 20px; position: relative;
      display: flex; align-items: center; padding: 0 8px;
    }
    .status-bar__time {
      position: absolute; left: 50%; top: 50%;
      transform: translate(-50%,-50%);
      font-family: Roboto,sans-serif; font-weight:600; font-size:12px; color:#1E1E1E; line-height:1;
    }
    .status-bar__right {
      position: absolute; right: 5px; top: 50%;
      transform: translateY(-50%);
      display: flex; align-items: center; gap: 4px;
    }
    .status-bar__carrier {
      font-family: Roboto,sans-serif; font-weight:400; font-size:12px;
      letter-spacing:-0.0014em; color:#1E1E1E; line-height:1;
    }
    .nav-bar {
      display: flex; justify-content: space-between;
      align-items: center; padding: 0 12px;
    }
    .nav-left  { width:102px; display:flex; align-items:center; }
    .nav-center { flex:1; }
    .nav-right  { width:102px; display:flex; justify-content:flex-end; }

    /* ══ BODY ══ */
    .body {
      flex: 1;
      height: 100%;
      display: flex;
      flex-direction: column;
      gap: 32px;
      padding: 0 16px;
      overflow-y: auto;
      scrollbar-width: none;
    }
    .body::-webkit-scrollbar { display: none; }

    .text-section { display:flex; flex-direction:column; gap:8px; }
    .subtitle {
      font-family: Montserrat,sans-serif; font-weight:400;
      font-size:14px; line-height:20px; color:#1E1E1E;
    }

    .form-section { display:flex; flex-direction:column; gap:32px; }

    /* ── Cascade items: fade + slide in ── */
    .cascade-item {
      opacity: 0;
      transform: translateY(8px);
      transition: opacity 0.25s ease, transform 0.25s ease;
    }
    .cascade-item.visible { opacity:1; transform:none; }

    /* ── Select button (dropdown trigger) ── */
    .c-select-btn {
      width: 100%;
      height: 48px;
      padding: 0 12px;
      background: #FFFFFF;
      border: 1px solid transparent;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .c-select-value {
      font-family: Montserrat,sans-serif; font-weight:400;
      font-size:14px; line-height:20px; color:#606060;
    }
    .c-select-value.selected { color:#1E1E1E; }

    /* ── Textarea detalles ── */
    .c-textarea-field {
      width: 100%;
      min-height: 104px;
      padding: 12px;
      background: #FFFFFF;
      border: 1px solid transparent;
      border-radius: 12px;
      font-family: Montserrat,sans-serif; font-weight: 400;
      font-size: 14px; line-height: 20px; color: #1E1E1E;
      outline: none;
      resize: none;
      overflow-y: auto;
      align-self: stretch;
    }
    .c-textarea-field::placeholder { color: #606060; }

    /* ── Detalles group layout ── */
    #grupoDetalles {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 4px;
      align-self: stretch;
    }

    /* ══ FOOTER ══ */
    .footer {
      flex-shrink: 0; margin-top: auto; display:flex; flex-direction:column;
      gap:20px; padding:0 16px 20px;
    }
    .progress-bar { display:flex; gap:8px; }
    .progress-bar__seg {
      flex:1; height:2px; border-radius:1px;
      background:#D2D4E1; position:relative; overflow:hidden;
    }
    .progress-bar__fill {
      position:absolute; left:0; top:0; height:100%;
      background:#FF2947; border-radius:1px;
    }
    .action-bar { display:flex; justify-content:space-between; align-items:center; }
    .btn-continuar { width:140px; }

    /* ══ DROPUP OVERLAY ══ */
    .dropup-overlay {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.45);
      z-index: 300;
      display: none;
      align-items: flex-end;
    }
    .dropup-overlay.is-open { display: flex; }

    .dropup {
      width: 100%;
      background: #FFFFFF;
      border-radius: 32px 32px 0 0;
      box-shadow: 0px -4px 8px 0px rgba(0,0,0,0.12);
      max-height: 72%;
      display: flex;
      flex-direction: column;
      gap: 16px;
      padding: 12px 16px 32px;
      transform: translateY(100%);
      transition: transform 0.32s cubic-bezier(0.32, 0, 0, 1);
    }
    .dropup-overlay.is-open .dropup { transform: translateY(0); }

    .dropup__header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }
    .dropup__header-spacer { width: 48px; height: 48px; }
    .dropup__title {
      font-family: Montserrat,sans-serif; font-weight: 700;
      font-size: 16px; line-height: 24px; color: #121E6C;
      text-align: center; flex: 1;
    }

    .dropup__search-wrap { flex-shrink: 0; }
    .dropup__search-bar {
      display: flex;
      align-items: center;
      gap: 12px;
      background: #F7F8FB;
      border-radius: 30px;
      padding: 12px;
    }
    .dropup__search-input {
      flex: 1; background: none; border: none;
      font-family: Montserrat,sans-serif; font-size: 14px; color: #1E1E1E;
      outline: none;
    }
    .dropup__search-input::placeholder { color: #606060; }

    .dropup__list {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
      scrollbar-width: none;
    }
    .dropup__list::-webkit-scrollbar { display: none; }

    .dropup__option {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 16px;
      align-self: stretch;
      width: 100%;
      height: 52px;
      padding: 32px 12px;
      background: #F7F8FB;
      border: none;
      border-radius: 100px;
      cursor: pointer;
      font-family: Montserrat,sans-serif; font-weight: 500;
      font-size: 14px; line-height: 20px; color: #121E6C;
      -webkit-tap-highlight-color: transparent;
    }
    .dropup__option:active { opacity: 0.8; }
    .dropup__option--selected { color: #FF2947; font-weight: 600; }

    /* ══ AYUDA ══ */
    .ayuda-btn {
      position:absolute; top:40px; right:16px;
      display:flex; flex-direction:row;
      align-items:center; gap:4px;
      padding:8px 8px 8px 12px;
      background:#FFFFFF; border:none;
      border-radius:100px;
      box-shadow:0px 4px 12px 0px rgba(18,30,108,0.08);
      cursor:pointer; height:32px; z-index:10;
    }
    .ayuda-btn__label {
      font-family:Montserrat,sans-serif; font-weight:500;
      font-size:14px; line-height:20px; color:#121E6C;
    }
    .ayuda-btn__icon {
      width:20px; height:20px;
      display:flex; align-items:center; justify-content:center;
    }
  </style>
</head>
<body>

<div class="phone">

  <!-- ── HEADER ── -->
  <div class="header">
    <div class="status-bar">
      <span class="status-bar__time">1:11 PM</span>
      <div class="status-bar__right">
        <svg width="17" height="11" viewBox="0 0 17 11" fill="none" aria-hidden="true">
          <rect x="0"  y="7"    width="3.1" height="4"    rx="0.5" fill="#1E1E1E"/>
          <rect x="4"  y="5"    width="3.1" height="6"    rx="0.5" fill="#1E1E1E"/>
          <rect x="8"  y="3"    width="3.1" height="8"    rx="0.5" fill="#1E1E1E"/>
          <rect x="12" y="0.5"  width="3.1" height="10.5" rx="0.5" fill="#1E1E1E"/>
        </svg>
        <svg width="16" height="12" viewBox="0 0 16 12" fill="none" aria-hidden="true">
          <circle cx="8" cy="10.5" r="1.3" fill="#1E1E1E"/>
          <path d="M4.8 7.5C5.8 6.5 6.9 6 8 6s2.2.5 3.2 1.5"  stroke="#1E1E1E" stroke-width="1.3" stroke-linecap="round" fill="none"/>
          <path d="M2.2 5C3.7 3.4 5.8 2.5 8 2.5s4.3.9 5.8 2.5" stroke="#1E1E1E" stroke-width="1.3" stroke-linecap="round" fill="none"/>
          <path d="M0 2.5C2.1.9 4.9 0 8 0s5.9.9 8 2.5"          stroke="#1E1E1E" stroke-width="1.3" stroke-linecap="round" fill="none"/>
        </svg>
        <span class="status-bar__carrier">Carrier</span>
      </div>
    </div>
    <div class="nav-bar">
      <div class="nav-left">
        <button class="c-btn-close"
                onclick="window.location.href='../index.html?skip_location=true'"
                aria-label="Cerrar">
          <img src="../components/ic_close.svg" width="24" height="24" alt="">
        </button>
      </div>
      <div class="nav-center"></div>
      <div class="nav-right"></div>
    </div>
  </div>

  <!-- ── BODY ── -->
  <div class="body" id="mainBody">

    <div class="text-section">
      <h1 class="c-screen-title">¿Cuál es la dirección de tu negocio?</h1>
      <p class="subtitle">Nos referimos al local, oficina o punto de venta físico.</p>
    </div>

    <div class="form-section">

      <!-- Departamento — siempre visible -->
      <div class="c-form-group">
        <label class="c-input-label">Departamento</label>
        <button class="c-select-btn" id="btnDepto" onclick="openDropup('depto')" aria-haspopup="listbox">
          <span class="c-select-value" id="valDepto">Selecciona</span>
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
            <path d="M4 6L8 10L12 6" stroke="#606060" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
      </div>

      <!-- Provincia — cascada -->
      <div class="c-form-group cascade-item" id="grupoProv" style="display:none">
        <label class="c-input-label">Provincia</label>
        <button class="c-select-btn" id="btnProv" onclick="openDropup('prov')" aria-haspopup="listbox">
          <span class="c-select-value" id="valProv">Selecciona</span>
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
            <path d="M4 6L8 10L12 6" stroke="#606060" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
      </div>

      <!-- Distrito — cascada -->
      <div class="c-form-group cascade-item" id="grupoDist" style="display:none">
        <label class="c-input-label">Distrito</label>
        <button class="c-select-btn" id="btnDist" onclick="openDropup('dist')" aria-haspopup="listbox">
          <span class="c-select-value" id="valDist">Selecciona</span>
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
            <path d="M4 6L8 10L12 6" stroke="#606060" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
      </div>

      <!-- Dirección — cascada -->
      <div class="c-form-group cascade-item" id="grupoDireccion" style="display:none">
        <label class="c-input-label" for="inputDireccion">Dirección</label>
        <input class="c-input-field" type="text" id="inputDireccion"
               autocapitalize="sentences"
               autocorrect="off"
               placeholder="Escribe tu dirección"
               oninput="checkForm()">
      </div>

      <!-- Detalles — cascada -->
      <div class="cascade-item" id="grupoDetalles" style="display:none">
        <label class="c-input-label" for="inputDetalles">Detalles de la dirección (opcional)</label>
        <textarea class="c-textarea-field" id="inputDetalles"
                  autocapitalize="sentences"
                  autocorrect="off"
                  placeholder="Ej: Manzana 1, torre 2, apartamento 502, al lado del Colegio Peruano Británico"></textarea>
      </div>

    </div>
  </div><!-- /body -->

  <!-- ── FOOTER ── -->
  <div class="footer">
    <div class="progress-bar" role="progressbar" aria-label="Paso 3 de 4, pantalla 5 de 8">
      <div class="progress-bar__seg">
        <div class="progress-bar__fill" style="width:100%"></div>
      </div>
      <div class="progress-bar__seg">
        <div class="progress-bar__fill" style="width:100%"></div>
      </div>
      <div class="progress-bar__seg">
        <div class="progress-bar__fill" style="width:62.5%"></div>
      </div>
    </div>
    <div class="action-bar">
      <button class="c-btn-text c-btn-text--active"
              onclick="window.location.href='correo_numero.html'">Atrás</button>
      <button class="c-btn-primary btn-continuar" id="btnContinuar"
              disabled onclick="goNext()">Continuar</button>
    </div>
  </div>

  <!-- ── DROPUP ── -->
  <div class="dropup-overlay" id="dropupOverlay" onclick="handleOverlayClick(event)">
    <div class="dropup" id="dropupSheet" onclick="event.stopPropagation()">
      <div class="dropup__header">
        <div class="dropup__header-spacer"></div>
        <h2 class="dropup__title" id="dropupTitle">Selecciona el departamento</h2>
        <button class="c-btn-close" onclick="closeDropupPanel()" aria-label="Cerrar">
          <img src="../components/ic_close.svg" width="24" height="24" alt="">
        </button>
      </div>
      <div class="dropup__search-wrap">
        <div class="dropup__search-bar">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <circle cx="10.5" cy="10.5" r="6.5" stroke="#606060" stroke-width="1.5"/>
            <path d="M16 16L20 20" stroke="#606060" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
          <input type="text" id="dropupSearch" class="dropup__search-input"
                 placeholder="Buscar..." oninput="filterDropup(this.value)">
        </div>
      </div>
      <div class="dropup__list" id="dropupList" role="listbox"></div>
    </div>
  </div>

  <!-- ── AYUDA ── -->
  <button class="ayuda-btn" aria-label="Ayuda">
    <span class="ayuda-btn__label">Ayuda</span>
    <span class="ayuda-btn__icon">
      <img src="../fase-1/ic_ayuda_bot.svg" width="20" height="20" alt="">
    </span>
  </button>

</div><!-- /phone -->

/* ═══════════════════════════════════════════
   ESTADO
   ═══════════════════════════════════════════ */
let selectedDepto = '';
let selectedProv  = '';
let selectedDist  = '';
let activeDropup  = null;

/* ═══════════════════════════════════════════
   CASCADA
   ═══════════════════════════════════════════ */
function revealField(id) {
  const el = document.getElementById(id);
  el.style.display = '';
  requestAnimationFrame(() => requestAnimationFrame(() => el.classList.add('visible')));
}

function hideField(id) {
  const el = document.getElementById(id);
  el.classList.remove('visible');
  el.style.display = 'none';
}

/* ═══════════════════════════════════════════
   DROPUP
   ═══════════════════════════════════════════ */
const TITLES = { depto: 'Selecciona el departamento', prov: 'Selecciona la provincia', dist: 'Selecciona el distrito' };

function openDropup(type) {
  activeDropup = type;
  document.getElementById('dropupTitle').textContent = TITLES[type];
  document.getElementById('dropupSearch').value = '';
  renderDropupList('');
  document.getElementById('dropupOverlay').classList.add('is-open');
  setTimeout(() => document.getElementById('dropupSearch').focus(), 350);
}

function getDropupItems() {
  if (activeDropup === 'depto') return Object.keys(PERU).sort();
  if (activeDropup === 'prov')  return Object.keys(PERU[selectedDepto] || {}).sort();
  if (activeDropup === 'dist')  return (PERU[selectedDepto]?.[selectedProv] || []).slice().sort();
  return [];
}

function getCurrentSelection() {
  if (activeDropup === 'depto') return selectedDepto;
  if (activeDropup === 'prov')  return selectedProv;
  if (activeDropup === 'dist')  return selectedDist;
  return '';
}

function renderDropupList(query) {
  const list  = document.getElementById('dropupList');
  const items = getDropupItems();
  const q     = query.toLowerCase().trim();
  const filtered = q ? items.filter(i => i.toLowerCase().includes(q)) : items;
  const current  = getCurrentSelection();

  list.innerHTML = filtered.map(item => {
    const selected = item === current ? ' dropup__option--selected' : '';
    return `<button class="dropup__option${selected}" onclick="selectOption('${item.replace(/'/g,"\\'")}')">
      ${item}
    </button>`;
  }).join('');
}

function filterDropup(query) {
  renderDropupList(query);
}

function selectOption(value) {
  if (activeDropup === 'depto') {
    const changed = value !== selectedDepto;
    selectedDepto = value;
    document.getElementById('valDepto').textContent = value;
    document.getElementById('valDepto').classList.add('selected');
    if (changed) {
      selectedProv = '';
      selectedDist = '';
      document.getElementById('valProv').textContent = 'Selecciona';
      document.getElementById('valProv').classList.remove('selected');
      document.getElementById('valDist').textContent = 'Selecciona';
      document.getElementById('valDist').classList.remove('selected');
      hideField('grupoDist');
      hideField('grupoDireccion');
      hideField('grupoDetalles');
    }
    revealField('grupoProv');
  } else if (activeDropup === 'prov') {
    const changed = value !== selectedProv;
    selectedProv = value;
    document.getElementById('valProv').textContent = value;
    document.getElementById('valProv').classList.add('selected');
    if (changed) {
      selectedDist = '';
      document.getElementById('valDist').textContent = 'Selecciona';
      document.getElementById('valDist').classList.remove('selected');
      hideField('grupoDireccion');
      hideField('grupoDetalles');
    }
    revealField('grupoDist');
  } else if (activeDropup === 'dist') {
    selectedDist = value;
    document.getElementById('valDist').textContent = value;
    document.getElementById('valDist').classList.add('selected');
    revealField('grupoDireccion');
    revealField('grupoDetalles');
    setTimeout(() => {
      document.getElementById('inputDireccion').focus();
      document.getElementById('mainBody').scrollTop = 9999;
    }, 300);
  }
  closeDropupPanel();
  checkForm();
}

function closeDropupPanel() {
  document.getElementById('dropupOverlay').classList.remove('is-open');
  activeDropup = null;
}

function handleOverlayClick(e) {
  if (e.target === document.getElementById('dropupOverlay')) closeDropupPanel();
}

/* ═══════════════════════════════════════════
   VALIDACIÓN
   ═══════════════════════════════════════════ */
function checkForm() {
  const ok = selectedDepto && selectedProv && selectedDist &&
             document.getElementById('inputDireccion').value.trim().length > 0;
  document.getElementById('btnContinuar').disabled = !ok;
}

/* ═══════════════════════════════════════════
   PERSISTENCIA Y NAVEGACIÓN
   ═══════════════════════════════════════════ */
function goNext() {
  localStorage.setItem('departamento_negocio',      selectedDepto);
  localStorage.setItem('provincia_negocio',         selectedProv);
  localStorage.setItem('distrito_negocio',          selectedDist);
  localStorage.setItem('direccion_negocio',         document.getElementById('inputDireccion').value.trim());
  localStorage.setItem('detalles_direccion_negocio', document.getElementById('inputDetalles').value.trim());
  window.location.href = 'ingresos_esperados.html';
}
