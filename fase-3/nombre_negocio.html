<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Bold – Nombre del negocio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Roboto:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../components/shared.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #D0D3E0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 40px 0;
      min-height: 100vh;
    }

    /* ── Phone shell: 863px (incluye teclado) ── */
    .phone {
      width: 393px;
      height: 863px;
      background: #F7F8FB;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    /* ══ HEADER ══ */
    .header {
      flex-shrink: 0;
      display: flex; flex-direction: column;
      gap: 20px; padding-bottom: 16px;
    }
    .status-bar {
      height: 20px; position: relative;
      display: flex; align-items: center; padding: 0 8px;
    }
    .status-bar__time {
      position: absolute; left: 50%; top: 50%;
      transform: translate(-50%, -50%);
      font-family: Roboto, sans-serif; font-weight: 600; font-size: 12px; color: #1E1E1E; line-height: 1;
    }
    .status-bar__right {
      position: absolute; right: 5px; top: 50%;
      transform: translateY(-50%);
      display: flex; align-items: center; gap: 4px;
    }
    .status-bar__carrier {
      font-family: Roboto, sans-serif; font-weight: 400; font-size: 12px;
      letter-spacing: -0.0014em; color: #1E1E1E; line-height: 1;
    }
    .nav-bar {
      display: flex; justify-content: space-between;
      align-items: center; padding: 0 12px;
    }
    .nav-left  { width: 102px; display: flex; align-items: center; }
    .nav-center { flex: 1; }
    .nav-right  { width: 102px; display: flex; justify-content: flex-end; }

    /* ══ BODY ══ */
    .body {
      flex: 1;
      display: flex; flex-direction: column;
      gap: 32px; padding: 0 16px;
      overflow-y: auto; scrollbar-width: none;
    }
    .body::-webkit-scrollbar { display: none; }

    .text-section { display: flex; flex-direction: column; gap: 8px; }
    .subtitle {
      font-family: Montserrat, sans-serif; font-weight: 400;
      font-size: 14px; line-height: 20px; color: #1E1E1E;
    }

    /* Input activo */
    .c-input-field--active { border-color: #121E6C !important; }

    /* ══ FOOTER ══ */
    .footer {
      flex-shrink: 0; display: flex; flex-direction: column;
      gap: 20px; padding: 0 16px 20px;
    }
    .progress-bar { display: flex; gap: 8px; }
    .progress-bar__seg {
      flex: 1; height: 2px; border-radius: 1px;
      background: #D2D4E1; position: relative; overflow: hidden;
    }
    .progress-bar__fill {
      position: absolute; left: 0; top: 0; height: 100%;
      background: #FF2947; border-radius: 1px;
    }
    .action-bar { display: flex; justify-content: space-between; align-items: center; }
    .btn-continuar { width: 140px; }

    /* ══ iOS QWERTY KEYBOARD ══ */
    .keyboard {
      flex-shrink: 0; width: 100%; height: 290px;
      background: #D1D3D9; position: relative; overflow: hidden;
    }
    .kb-rows {
      position: absolute; left: 3px; right: 3px; top: 6px;
      display: flex; flex-direction: column; gap: 13px;
    }
    .kb-row { display: flex; flex-direction: row; width: 100%; gap: 6px; }
    .kb-ltr {
      flex: 1; height: 46px; min-width: 0;
      background: #FFFFFF; border-radius: 4.6px;
      box-shadow: 0px 1px 0px 0px rgba(0,0,0,0.30);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; user-select: none;
      font-family: -apple-system, 'Helvetica Neue', sans-serif;
      font-size: 17px; font-weight: 400; color: #000;
      -webkit-tap-highlight-color: transparent;
    }
    .kb-ltr:active { background: #ACB0BD; }
    .kb-ltr--special {
      flex: 0 0 44px; background: #ACB0BE; box-shadow: none; font-size: 13px;
    }
    .kb-ltr--special:active { background: #888D9A; }
    .kb-row--mid { padding: 0 22px; }
    .kb-ltr--space  { flex: 4; font-size: 15px; }
    .kb-ltr--return {
      flex: 0 0 80px; background: #ACB0BE; box-shadow: none; font-size: 15px;
    }
    .kb-ltr--return:active { background: #888D9A; }
    .kb-ltr--shift-on {
      background: #FFFFFF !important;
      box-shadow: 0px 1px 0px 0px rgba(0,0,0,0.30) !important;
    }
    .kb-home {
      position: absolute; bottom: 8px; left: 50%;
      transform: translateX(-50%);
      width: 134px; height: 5px;
      background: #1C1C1E; border-radius: 3px; opacity: 0.18;
    }

    /* ══ AYUDA ══ */
    .ayuda-btn {
      position: absolute; top: 40px; right: 16px;
      display: flex; flex-direction: row; align-items: center; gap: 4px;
      padding: 8px 8px 8px 12px;
      background: #FFFFFF; border: none; border-radius: 100px;
      box-shadow: 0px 4px 12px 0px rgba(18, 30, 108, 0.08);
      cursor: pointer; height: 32px; z-index: 10;
    }
    .ayuda-btn__label {
      font-family: Montserrat, sans-serif; font-weight: 500;
      font-size: 14px; line-height: 20px; color: #121E6C;
    }
    .ayuda-btn__icon { width: 20px; height: 20px; display: flex; align-items: center; justify-content: center; }
  
    /* ── Mobile: sin frame, pantalla completa ── */
    html.is-mobile body {
      padding: 0;
      align-items: stretch;
      background: #F7F8FB;
    }
    html.is-mobile .phone {
      width: 100% !important;
      height: 100dvh !important;
      min-height: unset !important;
      overflow-x: hidden;
    }
    html.is-mobile .footer {
      padding-bottom: env(safe-area-inset-bottom);
    }
  </style>
  <script>
    (function() {
      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent) || window.innerWidth <= 430) {
        document.documentElement.classList.add('is-mobile');
      }
    })();
  </script>
</head>
<body>

<div class="phone">

  <!-- ── HEADER ── -->
  <div class="header">
    <div class="status-bar">
      <span class="status-bar__time">1:11 PM</span>
      <div class="status-bar__right">
        <svg width="17" height="11" viewBox="0 0 17 11" fill="none" aria-hidden="true">
          <rect x="0"  y="7"    width="3.1" height="4"    rx="0.5" fill="#1E1E1E"/>
          <rect x="4"  y="5"    width="3.1" height="6"    rx="0.5" fill="#1E1E1E"/>
          <rect x="8"  y="3"    width="3.1" height="8"    rx="0.5" fill="#1E1E1E"/>
          <rect x="12" y="0.5"  width="3.1" height="10.5" rx="0.5" fill="#1E1E1E"/>
        </svg>
        <svg width="16" height="12" viewBox="0 0 16 12" fill="none" aria-hidden="true">
          <circle cx="8" cy="10.5" r="1.3" fill="#1E1E1E"/>
          <path d="M4.8 7.5C5.8 6.5 6.9 6 8 6s2.2.5 3.2 1.5"  stroke="#1E1E1E" stroke-width="1.3" stroke-linecap="round" fill="none"/>
          <path d="M2.2 5C3.7 3.4 5.8 2.5 8 2.5s4.3.9 5.8 2.5" stroke="#1E1E1E" stroke-width="1.3" stroke-linecap="round" fill="none"/>
          <path d="M0 2.5C2.1.9 4.9 0 8 0s5.9.9 8 2.5"          stroke="#1E1E1E" stroke-width="1.3" stroke-linecap="round" fill="none"/>
        </svg>
        <span class="status-bar__carrier">Carrier</span>
      </div>
    </div>
    <div class="nav-bar">
      <div class="nav-left">
        <button class="c-btn-close"
                onclick="window.location.href='../index.html?skip_location=true'"
                aria-label="Cerrar">
          <img src="../components/ic_close.svg" width="24" height="24" alt="">
        </button>
      </div>
      <div class="nav-center"></div>
      <div class="nav-right"></div>
    </div>
  </div>

  <!-- ── BODY ── -->
  <div class="body">

    <div class="text-section">
      <h1 class="c-screen-title">¿Cuál es el nombre de tu negocio?</h1>
      <p class="subtitle">El nombre con el cual te conocen tus clientes.</p>
    </div>

    <div style="display:flex; flex-direction:column; gap:16px;">

      <div class="c-form-group">
        <label class="c-input-label" for="inputNombre">Nombre de tu negocio</label>
        <input class="c-input-field c-input-field--active" type="text" id="inputNombre"
               inputmode="none" readonly
               autocapitalize="words"
               placeholder="Escribe el nombre de tu negocio"
               onclick="onInputClick()">
      </div>

      <label class="c-checkbox-label">
        <input class="c-checkbox-native" type="checkbox" id="chkUsarNombre"
               onchange="handleCheckbox()">
        <span class="c-checkbox-visual">
          <span class="c-checkbox-mark"></span>
        </span>
        Usar mi nombre como nombre del negocio.
      </label>

    </div>

  </div><!-- /body -->

  <!-- ── FOOTER ── -->
  <div class="footer">
    <div class="progress-bar" role="progressbar" aria-label="Paso 3 de 4, pantalla 2 de 8">
      <div class="progress-bar__seg">
        <div class="progress-bar__fill" style="width:100%"></div>
      </div>
      <div class="progress-bar__seg">
        <div class="progress-bar__fill" style="width:100%"></div>
      </div>
      <div class="progress-bar__seg">
        <div class="progress-bar__fill" style="width:25%"></div>
      </div>
    </div>
    <div class="action-bar">
      <button class="c-btn-text c-btn-text--active"
              onclick="window.location.href='checkpoint-3.html'">Atrás</button>
      <button class="c-btn-primary btn-continuar" id="btnContinuar"
              disabled onclick="goNext()">Continuar</button>
    </div>
  </div>

  <!-- ── iOS QWERTY KEYBOARD ── -->
  <div class="keyboard" aria-hidden="true">
    <div class="kb-rows">
      <div class="kb-row">
        <div class="kb-ltr" onclick="typeKey('q')">q</div><div class="kb-ltr" onclick="typeKey('w')">w</div>
        <div class="kb-ltr" onclick="typeKey('e')">e</div><div class="kb-ltr" onclick="typeKey('r')">r</div>
        <div class="kb-ltr" onclick="typeKey('t')">t</div><div class="kb-ltr" onclick="typeKey('y')">y</div>
        <div class="kb-ltr" onclick="typeKey('u')">u</div><div class="kb-ltr" onclick="typeKey('i')">i</div>
        <div class="kb-ltr" onclick="typeKey('o')">o</div><div class="kb-ltr" onclick="typeKey('p')">p</div>
      </div>
      <div class="kb-row kb-row--mid">
        <div class="kb-ltr" onclick="typeKey('a')">a</div><div class="kb-ltr" onclick="typeKey('s')">s</div>
        <div class="kb-ltr" onclick="typeKey('d')">d</div><div class="kb-ltr" onclick="typeKey('f')">f</div>
        <div class="kb-ltr" onclick="typeKey('g')">g</div><div class="kb-ltr" onclick="typeKey('h')">h</div>
        <div class="kb-ltr" onclick="typeKey('j')">j</div><div class="kb-ltr" onclick="typeKey('k')">k</div>
        <div class="kb-ltr" onclick="typeKey('l')">l</div>
      </div>
      <div class="kb-row">
        <div class="kb-ltr kb-ltr--special" id="kbShift" onclick="toggleShift()">⇧</div>
        <div class="kb-ltr" onclick="typeKey('z')">z</div><div class="kb-ltr" onclick="typeKey('x')">x</div>
        <div class="kb-ltr" onclick="typeKey('c')">c</div><div class="kb-ltr" onclick="typeKey('v')">v</div>
        <div class="kb-ltr" onclick="typeKey('b')">b</div><div class="kb-ltr" onclick="typeKey('n')">n</div>
        <div class="kb-ltr" onclick="typeKey('m')">m</div>
        <div class="kb-ltr kb-ltr--special" onclick="deleteKey()">
          <svg width="20" height="15" viewBox="0 0 24 18" fill="none">
            <path d="M9.5 1H21C22.1 1 23 1.9 23 3V15C23 16.1 22.1 17 21 17H9.5C8.9 17 8.3 16.7 7.9 16.2L1.5 9L7.9 1.8C8.3 1.3 8.9 1 9.5 1Z" fill="none" stroke="#3C3C43" stroke-width="1.2" stroke-opacity="0.6"/>
            <path d="M15 6L11 12M11 6L15 12" stroke="#3C3C43" stroke-width="1.5" stroke-linecap="round" stroke-opacity="0.6"/>
          </svg>
        </div>
      </div>
      <div class="kb-row">
        <div class="kb-ltr kb-ltr--special" onclick="typeKey('1')">1</div>
        <div class="kb-ltr kb-ltr--special" onclick="typeKey('2')">2</div>
        <div class="kb-ltr kb-ltr--space" onclick="typeKey(' ')">espacio</div>
        <div class="kb-ltr kb-ltr--special" onclick="typeKey('.')">.</div>
        <div class="kb-ltr kb-ltr--return" onclick="goNext()">return</div>
      </div>
    </div>
    <div class="kb-home"></div>
  </div>

  <!-- ── AYUDA ── -->
  <button class="ayuda-btn" aria-label="Ayuda">
    <span class="ayuda-btn__label">Ayuda</span>
    <span class="ayuda-btn__icon">
      <img src="../fase-1/ic_ayuda_bot.svg" width="20" height="20" alt="">
    </span>
  </button>

</div><!-- /phone -->

<script>
  const inputNombre = document.getElementById('inputNombre');
  const chkUsarNombre = document.getElementById('chkUsarNombre');
  let shiftActive = true;

  function setShift(on) {
    shiftActive = on;
    document.getElementById('kbShift').classList.toggle('kb-ltr--shift-on', on);
  }
  function toggleShift() { setShift(!shiftActive); }

  function onInputClick() {
    inputNombre.classList.add('c-input-field--active');
    setShift(inputNombre.value.length === 0);
  }

  function typeKey(char) {
    if (chkUsarNombre.checked) return;
    if (char === ' ') {
      inputNombre.value += ' ';
      setShift(true);
    } else if (inputNombre.value.length === 0 || shiftActive) {
      inputNombre.value += char.toUpperCase();
      setShift(false);
    } else {
      inputNombre.value += char.toLowerCase();
    }
    checkForm();
  }

  function deleteKey() {
    if (chkUsarNombre.checked) return;
    inputNombre.value = inputNombre.value.slice(0, -1);
    const last = inputNombre.value.slice(-1);
    setShift(inputNombre.value.length === 0 || last === ' ');
    checkForm();
  }

  function handleCheckbox() {
    if (chkUsarNombre.checked) {
      const nombre = localStorage.getItem('nombres') || '';
      inputNombre.value = 'Negocio de ' + nombre;
      inputNombre.readOnly = true;
      inputNombre.classList.remove('c-input-field--active');
      inputNombre.classList.add('c-input-field--filled-disabled');
    } else {
      inputNombre.value = '';
      inputNombre.readOnly = true;
      inputNombre.classList.remove('c-input-field--filled-disabled');
      inputNombre.classList.add('c-input-field--active');
      setShift(true);
    }
    checkForm();
  }

  function checkForm() {
    document.getElementById('btnContinuar').disabled = inputNombre.value.trim().length === 0;
  }

  function goNext() {
    if (inputNombre.value.trim().length === 0) return;
    localStorage.setItem('nombre_negocio', inputNombre.value.trim());
    window.location.href = 'formas_venta.html';
  }

  // Foco inicial
  onInputClick();
</script>

</body>
</html>
