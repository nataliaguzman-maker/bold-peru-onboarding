<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=393, initial-scale=1">
  <title>Bold – Cuenta bancaria</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Roboto:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../components/shared.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #D0D3E0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 40px 0;
      min-height: 100vh;
    }

    .phone {
      width: 393px;
      height: 852px;
      background: #F7F8FB;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    /* ══ HEADER ══ */
    .header {
      flex-shrink: 0;
      display: flex; flex-direction: column;
      gap: 20px; padding-bottom: 16px;
    }
    .status-bar {
      height: 20px; position: relative;
      display: flex; align-items: center; padding: 0 8px;
    }
    .status-bar__time {
      position: absolute; left: 50%; top: 50%;
      transform: translate(-50%, -50%);
      font-family: Roboto, sans-serif; font-weight: 600; font-size: 12px;
      color: #1E1E1E; line-height: 1;
    }
    .status-bar__right {
      position: absolute; right: 5px; top: 50%;
      transform: translateY(-50%);
      display: flex; align-items: center; gap: 4px;
    }
    .status-bar__carrier {
      font-family: Roboto, sans-serif; font-weight: 400; font-size: 12px;
      letter-spacing: -0.0014em; color: #1E1E1E; line-height: 1;
    }
    .nav-bar {
      display: flex; justify-content: space-between;
      align-items: center; padding: 0 12px;
    }
    .nav-left  { width: 102px; display: flex; align-items: center; }
    .nav-center { flex: 1; }
    .nav-right  { width: 102px; display: flex; justify-content: flex-end; }

    /* ══ BODY ══ */
    .body {
      flex: 1;
      display: flex; flex-direction: column;
      gap: 32px;
      padding: 0 16px 16px;
      overflow-y: auto; scrollbar-width: none;
    }
    .body::-webkit-scrollbar { display: none; }

    .text-section { display: flex; flex-direction: column; gap: 8px; }
    .subtitle {
      font-family: Montserrat, sans-serif; font-weight: 400;
      font-size: 14px; line-height: 20px; color: #1E1E1E;
    }

    /* ── Alert ── */
    .alert-warning {
      display: flex; align-items: center;
      gap: 12px; padding: 12px;
      background: #FFF3D1;
      border: 1px solid #FFC217;
      border-radius: 16px;
      flex-shrink: 0;
    }
    .alert-icon { flex-shrink: 0; width: 24px; height: 24px; }
    .alert-text {
      flex: 1;
      font-family: Montserrat, sans-serif; font-weight: 400;
      font-size: 12px; line-height: 16px; color: #1E1E1E;
    }

    /* ── Form section ── */
    .form-section {
      display: flex; flex-direction: column;
      gap: 24px;
    }

    /* ── Info card (owner, readonly) ── */
    .info-card {
      background: #FFFFFF; border-radius: 16px;
      padding: 16px;
      display: flex; flex-direction: column;
      gap: 16px;
    }
    .info-row { display: flex; flex-direction: column; gap: 8px; }
    .info-label {
      font-family: Montserrat, sans-serif; font-weight: 700;
      font-size: 12px; line-height: 16px; color: #121E6C;
    }
    .info-value {
      font-family: Montserrat, sans-serif; font-weight: 400;
      font-size: 14px; line-height: 20px; color: #1E1E1E;
    }
    .info-divider { height: 1px; background: #F1F2F6; }

    /* ── Field label (dropdowns + input) ── */
    .field-label {
      display: block;
      font-family: Montserrat, sans-serif; font-weight: 600;
      font-size: 14px; line-height: 20px; color: #121E6C;
    }

    /* ── Dropdown button ── */
    .c-select-btn {
      width: 100%; height: 48px;
      padding: 0 12px;
      background: #FFFFFF;
      border: 1px solid transparent;
      border-radius: 12px;
      display: flex; align-items: center; justify-content: space-between;
      cursor: pointer; -webkit-tap-highlight-color: transparent;
    }
    .c-select-value {
      font-family: Montserrat, sans-serif; font-weight: 400;
      font-size: 14px; line-height: 20px; color: #606060;
    }
    .c-select-value.selected { color: #1E1E1E; font-weight: 500; }

    /* ══ FOOTER ══ */
    .footer {
      flex-shrink: 0;
      display: flex; flex-direction: column;
      gap: 20px; padding: 0 16px 20px;
      background: rgba(247, 248, 251, 0.7);
      backdrop-filter: blur(4px);
    }
    .progress-bar { display: flex; gap: 8px; }
    .progress-bar__seg {
      flex: 1; height: 2px; border-radius: 1px;
      background: #D2D4E1; position: relative; overflow: hidden;
    }
    .progress-bar__fill {
      position: absolute; left: 0; top: 0; height: 100%;
      background: #FF2947; border-radius: 1px;
    }
    .action-bar { display: flex; justify-content: space-between; align-items: center; }
    .btn-continuar { width: 140px; }
    #btnContinuar:disabled {
      background: #F48990 !important;
      opacity: 1 !important;
    }

    /* ══ BOTTOMSHEETS ══ */
    .dropup-overlay {
      position: absolute; inset: 0;
      background: rgba(0, 0, 0, 0.45);
      z-index: 300;
      display: none; align-items: flex-end;
    }
    .dropup-overlay.is-open { display: flex; }
    .dropup {
      width: 100%;
      background: #FFFFFF;
      border-radius: 32px 32px 0 0;
      box-shadow: 0px -4px 8px 0px rgba(0, 0, 0, 0.12);
      max-height: 75%;
      display: flex; flex-direction: column;
      gap: 16px; padding: 12px 16px 32px;
      transform: translateY(100%);
      transition: transform 0.32s cubic-bezier(0.32, 0, 0, 1);
    }
    .dropup-overlay.is-open .dropup { transform: translateY(0); }

    .dropup__header {
      display: flex; align-items: center;
      justify-content: space-between; flex-shrink: 0;
    }
    .dropup__header-spacer { width: 48px; height: 48px; }
    .dropup__title {
      font-family: Montserrat, sans-serif; font-weight: 700;
      font-size: 16px; line-height: 24px; color: #121E6C;
      text-align: center; flex: 1;
    }

    .dropup__search-wrap { flex-shrink: 0; }
    .dropup__search-bar {
      display: flex; align-items: center; gap: 12px;
      background: #F7F8FB; border-radius: 30px; padding: 12px;
    }
    .dropup__search-input {
      flex: 1; background: none; border: none;
      font-family: Montserrat, sans-serif; font-size: 14px; color: #1E1E1E;
      outline: none;
    }
    .dropup__search-input::placeholder { color: #606060; }

    .dropup__list {
      flex: 1; overflow-y: auto;
      display: flex; flex-direction: column;
      gap: 8px; scrollbar-width: none;
    }
    .dropup__list::-webkit-scrollbar { display: none; }
    .dropup__option {
      display: flex; align-items: center; justify-content: center;
      width: 100%; min-height: 52px;
      padding: 16px 12px;
      background: #F7F8FB; border: none; border-radius: 100px;
      cursor: pointer;
      font-family: Montserrat, sans-serif; font-weight: 500;
      font-size: 14px; line-height: 20px; color: #121E6C;
      -webkit-tap-highlight-color: transparent;
    }
    .dropup__option:active { opacity: 0.8; }
    .dropup__option--selected { color: #FF2947; font-weight: 600; }

    /* ══ AYUDA ══ */
    .ayuda-btn {
      position: absolute; top: 40px; right: 16px;
      display: flex; flex-direction: row; align-items: center; gap: 4px;
      padding: 8px 8px 8px 12px;
      background: #FFFFFF; border: none; border-radius: 100px;
      box-shadow: 0px 4px 12px 0px rgba(18, 30, 108, 0.08);
      cursor: pointer; height: 32px; z-index: 10;
    }
    .ayuda-btn__label {
      font-family: Montserrat, sans-serif; font-weight: 500;
      font-size: 14px; line-height: 20px; color: #121E6C;
    }
    .ayuda-btn__icon { width: 20px; height: 20px; display: flex; align-items: center; justify-content: center; }

  </style>
</head>
<body>

<div class="phone">

  <!-- ── HEADER ── -->
  <div class="header">
    <div class="status-bar">
      <span class="status-bar__time">1:11 PM</span>
      <div class="status-bar__right">
        <svg width="17" height="11" viewBox="0 0 17 11" fill="none" aria-hidden="true">
          <rect x="0"  y="7"    width="3.1" height="4"    rx="0.5" fill="#1E1E1E"/>
          <rect x="4"  y="5"    width="3.1" height="6"    rx="0.5" fill="#1E1E1E"/>
          <rect x="8"  y="3"    width="3.1" height="8"    rx="0.5" fill="#1E1E1E"/>
          <rect x="12" y="0.5"  width="3.1" height="10.5" rx="0.5" fill="#1E1E1E"/>
        </svg>
        <svg width="16" height="12" viewBox="0 0 16 12" fill="none" aria-hidden="true">
          <circle cx="8" cy="10.5" r="1.3" fill="#1E1E1E"/>
          <path d="M4.8 7.5C5.8 6.5 6.9 6 8 6s2.2.5 3.2 1.5"  stroke="#1E1E1E" stroke-width="1.3" stroke-linecap="round" fill="none"/>
          <path d="M2.2 5C3.7 3.4 5.8 2.5 8 2.5s4.3.9 5.8 2.5" stroke="#1E1E1E" stroke-width="1.3" stroke-linecap="round" fill="none"/>
          <path d="M0 2.5C2.1.9 4.9 0 8 0s5.9.9 8 2.5"          stroke="#1E1E1E" stroke-width="1.3" stroke-linecap="round" fill="none"/>
        </svg>
        <span class="status-bar__carrier">Carrier</span>
      </div>
    </div>
    <div class="nav-bar">
      <div class="nav-left">
        <button class="c-btn-close"
                onclick="window.location.href='../index.html'"
                aria-label="Cerrar">
          <img src="../components/ic_close.svg" width="24" height="24" alt="">
        </button>
      </div>
      <div class="nav-center"></div>
      <div class="nav-right"></div>
    </div>
  </div>

  <!-- ── BODY ── -->
  <div class="body">

    <div class="text-section">
      <h1 class="c-screen-title">Agrega tu cuenta bancaria</h1>
      <p class="subtitle">En esta cuenta recibirás el dinero de tus ventas.</p>
    </div>

    <div class="alert-warning" role="alert">
      <div class="alert-icon" aria-hidden="true">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
          <circle cx="12" cy="12" r="11" fill="#FFC217"/>
          <path d="M12 7V13.5" stroke="white" stroke-width="2" stroke-linecap="round"/>
          <circle cx="12" cy="17" r="1.2" fill="white"/>
        </svg>
      </div>
      <p class="alert-text">La cuenta debe pertenecer al titular registrado.</p>
    </div>

    <div class="form-section">

      <!-- Titular info (readonly) -->
      <div class="info-card">
        <div class="info-row">
          <span class="info-label">Nombre del titular</span>
          <span class="info-value" id="ownerName">—</span>
        </div>
        <div class="info-divider"></div>
        <div class="info-row">
          <span class="info-label">Documento del titular</span>
          <span class="info-value" id="ownerDoc">DNI. —</span>
        </div>
      </div>

      <!-- Banco -->
      <div class="c-form-group">
        <label class="field-label">Banco</label>
        <button class="c-select-btn" id="btnBanco" onclick="openBancoSheet()" aria-haspopup="listbox">
          <span class="c-select-value" id="valBanco">Selecciona tu banco</span>
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M6 9L12 15L18 9" stroke="#606060" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
      </div>

      <!-- Tipo de cuenta -->
      <div class="c-form-group">
        <label class="field-label">¿Qué tipo de cuenta es?</label>
        <button class="c-select-btn" id="btnTipo" onclick="openTipoSheet()" aria-haspopup="listbox">
          <span class="c-select-value selected" id="valTipo">Ahorros</span>
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M6 9L12 15L18 9" stroke="#606060" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
      </div>

      <!-- Número de cuenta -->
      <div class="c-form-group">
        <span class="field-label">Número de cuenta</span>
        <input
          id="inputCuenta"
          class="c-input-field"
          type="text"
          inputmode="text"
          placeholder="Escribe el número de tu cuenta"
          autocomplete="off"
          autocapitalize="none"
          autocorrect="off"
          oninput="checkForm()"
        >
      </div>

    </div>
  </div><!-- /body -->

  <!-- ── FOOTER ── -->
  <div class="footer">
    <div class="progress-bar" role="progressbar" aria-label="Paso 8 de 8">
      <div class="progress-bar__seg"><div class="progress-bar__fill" style="width:100%"></div></div>
      <div class="progress-bar__seg"><div class="progress-bar__fill" style="width:100%"></div></div>
      <div class="progress-bar__seg"><div class="progress-bar__fill" style="width:100%"></div></div>
      <div class="progress-bar__seg"><div class="progress-bar__fill" style="width:100%"></div></div>
    </div>
    <div class="action-bar">
      <button class="c-btn-text c-btn-text--active"
              onclick="window.location.href='09-invitar-trabajadores.html'">Atrás</button>
      <button class="c-btn-primary btn-continuar" id="btnContinuar"
              disabled onclick="goNext()">Continuar</button>
    </div>
  </div>

  <!-- ── BANCO BOTTOMSHEET ── -->
  <div class="dropup-overlay" id="bancoOverlay" onclick="handleOverlayClick(event,'bancoOverlay')">
    <div class="dropup" onclick="event.stopPropagation()">
      <div class="dropup__header">
        <div class="dropup__header-spacer"></div>
        <h2 class="dropup__title">Banco</h2>
        <button class="c-btn-close" onclick="closeBancoSheet()" aria-label="Cerrar">
          <img src="../components/ic_close.svg" width="24" height="24" alt="">
        </button>
      </div>
      <div class="dropup__search-wrap">
        <div class="dropup__search-bar">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <circle cx="10.5" cy="10.5" r="6.5" stroke="#606060" stroke-width="1.5"/>
            <path d="M16 16L20 20" stroke="#606060" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
          <input type="text" id="bancoSearch" class="dropup__search-input"
                 placeholder="Buscar..." oninput="filterBancos(this.value)">
        </div>
      </div>
      <div class="dropup__list" id="bancoList" role="listbox"></div>
    </div>
  </div>

  <!-- ── TIPO DE CUENTA BOTTOMSHEET ── -->
  <div class="dropup-overlay" id="tipoOverlay" onclick="handleOverlayClick(event,'tipoOverlay')">
    <div class="dropup" onclick="event.stopPropagation()">
      <div class="dropup__header">
        <div class="dropup__header-spacer"></div>
        <h2 class="dropup__title">Tipo de cuenta</h2>
        <button class="c-btn-close" onclick="closeTipoSheet()" aria-label="Cerrar">
          <img src="../components/ic_close.svg" width="24" height="24" alt="">
        </button>
      </div>
      <div class="dropup__list" role="listbox" style="flex:unset">
        <button class="dropup__option" id="optAhorros" onclick="selectTipo('Ahorros')">Ahorros</button>
        <button class="dropup__option" id="optCorriente" onclick="selectTipo('Corriente')">Corriente</button>
      </div>
    </div>
  </div>

  <!-- ── AYUDA ── -->
  <button class="ayuda-btn" aria-label="Ayuda">
    <span class="ayuda-btn__label">Ayuda</span>
    <span class="ayuda-btn__icon">
      <img src="../fase-1/ic_ayuda_bot.svg" width="20" height="20" alt="">
    </span>
  </button>

</div><!-- /phone -->

<script>
  var BANKS = [
    'Alfin Banco', 'BanBif', 'Banco de la Nación', 'Banco Falabella',
    'Banco GNB Perú', 'Banco Pichincha', 'BBVA Perú',
    'BCP - Banco de Crédito del Perú', 'CMAC Arequipa', 'CMAC Cusco',
    'CMAC Huancayo', 'CMAC Ica', 'CMAC Piura', 'CMAC Sullana',
    'CMAC Tacna', 'CMAC Trujillo', 'Compartamos Financiera',
    'Credinka', 'Cuentas Cencosud', 'Financiera OH',
    'Interbank', 'MiBanco', 'Scotiabank Perú'
  ];

  var selectedBanco = '';
  var selectedTipo  = 'Ahorros';

  /* ── Init ── */
  function init() {
    var nombres   = localStorage.getItem('nombres')           || '';
    var apellidos = localStorage.getItem('apellidos')         || '';
    var docNum    = localStorage.getItem('numero_documento')  || '';

    document.getElementById('ownerName').textContent =
      (nombres + ' ' + apellidos).trim() || '—';
    document.getElementById('ownerDoc').textContent =
      docNum ? 'DNI. ' + docNum : 'DNI. —';

    var savedBanco = localStorage.getItem('banco_seleccionado');
    if (savedBanco && BANKS.indexOf(savedBanco) !== -1) {
      selectedBanco = savedBanco;
      var valEl = document.getElementById('valBanco');
      valEl.textContent = savedBanco;
      valEl.classList.add('selected');
    }

    var savedTipo = localStorage.getItem('tipo_cuenta');
    if (savedTipo === 'Ahorros' || savedTipo === 'Corriente') {
      selectedTipo = savedTipo;
      document.getElementById('valTipo').textContent = savedTipo;
    }

    var savedCuenta = localStorage.getItem('numero_cuenta');
    if (savedCuenta) {
      document.getElementById('inputCuenta').value = savedCuenta;
    }

    renderBancos('');
    updateTipoOptions();
    checkForm();
  }

  /* ── Validation ── */
  function checkForm() {
    var ok = selectedBanco !== '' &&
             document.getElementById('inputCuenta').value.trim().length > 0;
    document.getElementById('btnContinuar').disabled = !ok;
  }

  /* ── Navigation ── */
  function goNext() {
    if (document.getElementById('btnContinuar').disabled) return;
    localStorage.setItem('banco_seleccionado', selectedBanco);
    localStorage.setItem('tipo_cuenta',        selectedTipo);
    localStorage.setItem('numero_cuenta',      document.getElementById('inputCuenta').value.trim());
    window.location.href = '10-terminos-condiciones.html';
  }

  /* ── Banco bottomsheet ── */
  function openBancoSheet() {
    document.getElementById('bancoSearch').value = '';
    renderBancos('');
    document.getElementById('bancoOverlay').classList.add('is-open');
  }

  function closeBancoSheet() {
    document.getElementById('bancoOverlay').classList.remove('is-open');
  }

  function filterBancos(query) {
    renderBancos(query);
  }

  function renderBancos(query) {
    var list = document.getElementById('bancoList');
    var q = query.toLowerCase().trim();
    var filtered = q ? BANKS.filter(function(b) { return b.toLowerCase().indexOf(q) !== -1; }) : BANKS;
    list.innerHTML = filtered.map(function(b) {
      var sel = b === selectedBanco ? ' dropup__option--selected' : '';
      return '<button class="dropup__option' + sel + '" onclick="selectBanco(\'' +
             b.replace(/'/g, "\\'") + '\')">' + b + '</button>';
    }).join('');
  }

  function selectBanco(name) {
    selectedBanco = name;
    var valEl = document.getElementById('valBanco');
    valEl.textContent = name;
    valEl.classList.add('selected');
    closeBancoSheet();
    checkForm();
  }

  /* ── Tipo de cuenta bottomsheet ── */
  function openTipoSheet() {
    updateTipoOptions();
    document.getElementById('tipoOverlay').classList.add('is-open');
  }

  function closeTipoSheet() {
    document.getElementById('tipoOverlay').classList.remove('is-open');
  }

  function updateTipoOptions() {
    document.getElementById('optAhorros').classList.toggle('dropup__option--selected', selectedTipo === 'Ahorros');
    document.getElementById('optCorriente').classList.toggle('dropup__option--selected', selectedTipo === 'Corriente');
  }

  function selectTipo(tipo) {
    selectedTipo = tipo;
    var valEl = document.getElementById('valTipo');
    valEl.textContent = tipo;
    valEl.classList.add('selected');
    updateTipoOptions();
    closeTipoSheet();
  }

  /* ── Overlay tap-outside ── */
  function handleOverlayClick(e, overlayId) {
    if (e.target === document.getElementById(overlayId)) {
      document.getElementById(overlayId).classList.remove('is-open');
    }
  }

  /* ── Boot ── */
  init();
</script>

</body>
</html>
