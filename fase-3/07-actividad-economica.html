<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Bold – Actividad económica</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Roboto:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../components/shared.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #D0D3E0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 40px 0;
      min-height: 100vh;
    }

    .phone {
      width: 393px;
      height: 852px;
      background: #F7F8FB;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    /* ══ HEADER ══ */
    .header {
      flex-shrink: 0;
      display: flex; flex-direction: column;
      gap: 20px; padding-bottom: 16px;
    }
    .status-bar {
      height: 20px; position: relative;
      display: flex; align-items: center; padding: 0 8px;
    }
    .status-bar__time {
      position: absolute; left: 50%; top: 50%;
      transform: translate(-50%, -50%);
      font-family: Roboto, sans-serif; font-weight: 600; font-size: 12px; color: #1E1E1E; line-height: 1;
    }
    .status-bar__right {
      position: absolute; right: 5px; top: 50%;
      transform: translateY(-50%);
      display: flex; align-items: center; gap: 4px;
    }
    .status-bar__carrier {
      font-family: Roboto, sans-serif; font-weight: 400; font-size: 12px;
      letter-spacing: -0.0014em; color: #1E1E1E; line-height: 1;
    }
    .nav-bar {
      display: flex; justify-content: space-between;
      align-items: center; padding: 0 12px;
    }
    .nav-left  { width: 102px; display: flex; align-items: center; }
    .nav-center { flex: 1; }
    .nav-right  { width: 102px; display: flex; justify-content: flex-end; }

    /* ══ BODY ══ */
    .body {
      flex: 1;
      display: flex; flex-direction: column;
      gap: 32px;
      padding: 0 16px;
      overflow: hidden;
      min-height: 0;
    }

    .page-title {
      flex-shrink: 0;
      font-family: Montserrat, sans-serif;
      font-weight: 600; font-size: 20px; line-height: 24px; color: #1E1E1E;
    }

    /* ── Search section ── */
    .search-section {
      flex: 1;
      display: flex; flex-direction: column;
      gap: 24px;
      overflow: hidden;
      min-height: 0;
    }

    /* ── Search bar ── */
    .search-bar {
      flex-shrink: 0;
      display: flex; flex-direction: row;
      align-items: center;
      gap: 12px;
      padding: 12px;
      background: #FFFFFF;
      border-radius: 30px;
    }
    .search-bar__input {
      flex: 1;
      min-width: 0;
      border: none;
      outline: none;
      font-family: Montserrat, sans-serif;
      font-weight: 400; font-size: 14px; line-height: 20px;
      color: #1E1E1E;
      background: transparent;
    }
    .search-bar__input::placeholder { color: #606060; }

    /* ── Activity list ── */
    .activity-list {
      flex: 1;
      overflow-y: auto;
      display: flex; flex-direction: column;
      gap: 8px;
      scrollbar-width: none;
    }
    .activity-list::-webkit-scrollbar { display: none; }

    /* ── Activity item ── */
    .activity-item {
      flex-shrink: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      align-self: stretch;
      gap: 16px;
      padding: 0 12px;
      height: 64px;
      background: #FFFFFF;
      border-radius: 12px;
      border: 1px solid transparent;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      transition: border-color 0.12s;
    }
    .activity-item--selected {
      border-color: #FF2947;
    }
    .activity-item__label {
      flex: 1;
      font-family: Montserrat, sans-serif;
      font-weight: 500; font-size: 14px; line-height: 20px;
      color: #1E1E1E;
      text-align: left;
      transition: color 0.12s;
    }
    .activity-item--selected .activity-item__label {
      color: #FF2947;
    }

    /* ── Radio button ── */
    .radio-btn {
      flex-shrink: 0;
      width: 28px; height: 28px;
    }

    /* ── Empty state ── */
    .empty-msg {
      font-family: Montserrat, sans-serif;
      font-weight: 400; font-size: 14px; line-height: 20px;
      color: #606060;
      text-align: center;
      padding: 32px 0;
    }

    /* ══ FOOTER ══ */
    .footer {
      flex-shrink: 0;
      display: flex; flex-direction: column;
      gap: 20px; padding: 0 16px 20px;
      background: rgba(247, 248, 251, 0.9);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }
    .progress-bar { display: flex; gap: 8px; }
    .progress-bar__seg {
      flex: 1; height: 2px; border-radius: 1px;
      background: #D2D4E1; position: relative; overflow: hidden;
    }
    .progress-bar__fill {
      position: absolute; left: 0; top: 0; height: 100%;
      background: #FF2947; border-radius: 1px;
    }
    .action-bar { display: flex; justify-content: space-between; align-items: center; }
    .btn-continuar { width: 140px; }

    /* ══ OVERLAY ══ */
    .bs-overlay {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.5);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s ease;
      z-index: 20;
    }
    .bs-overlay--visible {
      opacity: 1;
      pointer-events: all;
    }

    /* ══ BOTTOM SHEET ══ */
    .bs {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      background: #FFFFFF;
      border-radius: 32px 32px 0 0;
      box-shadow: 0px -4px 8px 0px rgba(0, 0, 0, 0.12);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      padding: 16px 24px 20px;
      transform: translateY(100%);
      transition: transform 0.4s ease;
      z-index: 21;
    }
    .bs--visible { transform: translateY(0); }

    .bs-handle {
      width: 40px; height: 4px;
      background: #D2D4E1;
      border-radius: 2px;
      flex-shrink: 0;
    }
    .bs-illustration {
      width: 235px; height: 148px;
      object-fit: contain;
    }
    .bs-title {
      font-family: Montserrat, sans-serif;
      font-weight: 700; font-size: 20px; line-height: 24px;
      color: #1E1E1E; text-align: center;
    }
    .bs-text {
      display: flex; flex-direction: column;
      align-self: stretch; gap: 8px;
    }
    .bs-body {
      font-family: Montserrat, sans-serif;
      font-weight: 400; font-size: 14px; line-height: 20px;
      color: #1E1E1E; text-align: center;
    }
    .bs-caption {
      font-family: Montserrat, sans-serif;
      font-weight: 400; font-size: 12px; line-height: 16px;
      color: #969696; text-align: center;
    }
    .bs-actions {
      display: flex; flex-direction: column;
      align-items: center; align-self: stretch;
      gap: 8px; padding-top: 8px;
    }
    .bs-btn-primary { width: 100%; }
    .bs-btn-secondary {
      font-family: Montserrat, sans-serif;
      font-weight: 700; font-size: 12px; line-height: 16px;
      color: #121E6C;
      text-decoration: underline; text-underline-offset: 2px;
      background: none; border: none;
      cursor: pointer; padding: 12px 0;
      text-align: center;
    }

    /* ══ AYUDA ══ */
    .ayuda-btn {
      position: absolute; top: 40px; right: 16px;
      display: flex; flex-direction: row; align-items: center; gap: 4px;
      padding: 8px 8px 8px 12px;
      background: #FFFFFF; border: none; border-radius: 100px;
      box-shadow: 0px 4px 12px 0px rgba(18, 30, 108, 0.08);
      cursor: pointer; height: 32px; z-index: 10;
    }
    .ayuda-btn__label {
      font-family: Montserrat, sans-serif; font-weight: 500;
      font-size: 14px; line-height: 20px; color: #121E6C;
    }
    .ayuda-btn__icon { width: 20px; height: 20px; display: flex; align-items: center; justify-content: center; }
  
    /* ── Mobile: sin frame, pantalla completa ── */
    html.is-mobile body {
      padding: 0;
      align-items: stretch;
      background: #F7F8FB;
    }
    html.is-mobile .phone {
      width: 100% !important;
      height: 100dvh !important;
      min-height: unset !important;
      overflow-x: hidden;
    }
    html.is-mobile .footer {
      padding-bottom: env(safe-area-inset-bottom);
    }
  </style>
  <script>
    (function() {
      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent) || window.innerWidth <= 430) {
        document.documentElement.classList.add('is-mobile');
      }
    })();
  </script>
</head>
<body>

<div class="phone">

  <!-- ── HEADER ── -->
  <div class="header">
    <div class="status-bar">
      <span class="status-bar__time">1:11 PM</span>
      <div class="status-bar__right">
        <svg width="17" height="11" viewBox="0 0 17 11" fill="none" aria-hidden="true">
          <rect x="0"  y="7"    width="3.1" height="4"    rx="0.5" fill="#1E1E1E"/>
          <rect x="4"  y="5"    width="3.1" height="6"    rx="0.5" fill="#1E1E1E"/>
          <rect x="8"  y="3"    width="3.1" height="8"    rx="0.5" fill="#1E1E1E"/>
          <rect x="12" y="0.5"  width="3.1" height="10.5" rx="0.5" fill="#1E1E1E"/>
        </svg>
        <svg width="16" height="12" viewBox="0 0 16 12" fill="none" aria-hidden="true">
          <circle cx="8" cy="10.5" r="1.3" fill="#1E1E1E"/>
          <path d="M4.8 7.5C5.8 6.5 6.9 6 8 6s2.2.5 3.2 1.5"  stroke="#1E1E1E" stroke-width="1.3" stroke-linecap="round" fill="none"/>
          <path d="M2.2 5C3.7 3.4 5.8 2.5 8 2.5s4.3.9 5.8 2.5" stroke="#1E1E1E" stroke-width="1.3" stroke-linecap="round" fill="none"/>
          <path d="M0 2.5C2.1.9 4.9 0 8 0s5.9.9 8 2.5"          stroke="#1E1E1E" stroke-width="1.3" stroke-linecap="round" fill="none"/>
        </svg>
        <span class="status-bar__carrier">Carrier</span>
      </div>
    </div>
    <div class="nav-bar">
      <div class="nav-left">
        <button class="c-btn-close"
                onclick="window.location.href='../index.html?skip_location=true'"
                aria-label="Cerrar">
          <img src="../components/ic_close.svg" width="24" height="24" alt="">
        </button>
      </div>
      <div class="nav-center"></div>
      <div class="nav-right"></div>
    </div>
  </div>

  <!-- ── BODY ── -->
  <div class="body">

    <h1 class="page-title">¿Cuál es la actividad de tu negocio?</h1>

    <div class="search-section">

      <!-- Buscador -->
      <div class="search-bar">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path fill-rule="evenodd" clip-rule="evenodd"
            d="M10.5 3a7.5 7.5 0 1 0 4.55 13.463l4.743 4.744a1 1 0 0 0 1.414-1.414l-4.744-4.744A7.5 7.5 0 0 0 10.5 3ZM5 10.5a5.5 5.5 0 1 1 11 0 5.5 5.5 0 0 1-11 0Z"
            fill="#606060"/>
        </svg>
        <input
          id="searchInput"
          class="search-bar__input"
          type="text"
          placeholder="Buscar actividad"
          autocomplete="off"
          autocapitalize="none"
          autocorrect="off"
          aria-label="Buscar actividad económica"
        >
      </div>

      <!-- Lista de actividades -->
      <div class="activity-list" id="activityList" role="listbox" aria-label="Actividades económicas"></div>

    </div>
  </div><!-- /body -->

  <!-- ── FOOTER ── -->
  <div class="footer">
    <div class="progress-bar" role="progressbar" aria-label="Paso 3 de 4, pantalla 7 de 8">
      <div class="progress-bar__seg">
        <div class="progress-bar__fill" style="width:100%"></div>
      </div>
      <div class="progress-bar__seg">
        <div class="progress-bar__fill" style="width:100%"></div>
      </div>
      <div class="progress-bar__seg">
        <div class="progress-bar__fill" style="width:87.5%"></div>
      </div>
    </div>
    <div class="action-bar">
      <button class="c-btn-text c-btn-text--active" id="btnAtras">Atrás</button>
      <button class="c-btn-primary btn-continuar" id="btnContinuar" disabled>Continuar</button>
    </div>
  </div>

  <!-- ── AYUDA ── -->
  <button class="ayuda-btn" aria-label="Ayuda">
    <span class="ayuda-btn__label">Ayuda</span>
    <span class="ayuda-btn__icon">
      <img src="../fase-1/ic_ayuda_bot.svg" width="20" height="20" alt="">
    </span>
  </button>

  <!-- ── OVERLAY ── -->
  <div class="bs-overlay" id="bsOverlay"></div>

  <!-- ── BOTTOM SHEET ── -->
  <div class="bs" id="bottomSheet" role="dialog" aria-modal="true">
    <div class="bs-handle"></div>
    <img class="bs-illustration" src="assets/ill_trabajadores.png" width="235" height="148" alt="">
    <p class="bs-title">¿Tienes trabajadores en tu negocio?</p>
    <div class="bs-text">
      <p class="bs-body">Invita a tus trabajadores para que puedan cobrar desde sus propios dispositivos.</p>
      <p class="bs-caption">Puedes modificarlo más tarde.</p>
    </div>
    <div class="bs-actions">
      <button class="c-btn-primary bs-btn-primary" id="btnInvitar">Invitar trabajadores</button>
      <button class="bs-btn-secondary" id="btnNoInvitar">No tengo o no quiero invitarlos aún</button>
    </div>
  </div>

</div><!-- /phone -->

<script>
  const actividades = [
    "Abarrotes / Bodega",
    "Agencia de viajes",
    "Agroquímicos",
    "Alimentos y bebidas al por mayor",
    "Alquiler de vehículos",
    "Arquitectura e ingeniería",
    "Artesanías",
    "Asesoría legal / Abogados",
    "Asesoría tributaria",
    "Auto partes y repuestos",
    "Automotriz - Pintura y latonería",
    "Bar / Cantina",
    "Bebidas y licores",
    "Bordados y estampados",
    "Cafetería",
    "Carpintería",
    "Catering y banquetes",
    "Centro de belleza / Salón",
    "Centro de estética",
    "Centro médico / Consultorio",
    "Cerámicos y materiales de construcción",
    "Cerrajería",
    "Chifa / Cocina china",
    "Clases particulares",
    "Clínica veterinaria",
    "Colegio / Academia",
    "Comercio electrónico (e-commerce)",
    "Confecciones y costura",
    "Confitería / Dulcería",
    "Construcción y acabados",
    "Consultoría empresarial",
    "Cosméticos y cuidado personal",
    "Cristalería y vidrios",
    "Decoración y diseño de interiores",
    "Delivery de comida",
    "Depósito de gas / Gasolinera",
    "Desinfección y fumigación",
    "Diseño de modas",
    "Distribuidora de productos",
    "Electricista / Instalaciones",
    "Electrónica y componentes",
    "Equipos de cómputo e informática",
    "Estudio de tatuajes",
    "Eventos y producciones",
    "Fabricación de muebles a medida",
    "Farmacia / Botica",
    "Ferretería",
    "Florería",
    "Fotografía y video",
    "Ganadería y avicultura",
    "Gimnasio",
    "Guardería / Nido",
    "Heladería / Jugería",
    "Hospedaje / Hostal",
    "Importación y exportación",
    "Impresiones y copias",
    "Instalación de alarmas y cámaras",
    "Joyería",
    "Lavado y detallado de autos",
    "Lavandería",
    "Librería / Papelería",
    "Limpieza y mantenimiento",
    "Lubricentro",
    "Manufactura y producción",
    "Marketing digital",
    "Materiales eléctricos",
    "Mecánica automotriz",
    "Menajes y electrodomésticos",
    "Minimarket",
    "Mudanzas y logística",
    "Mueblería",
    "Nutrición y dietética",
    "Óptica y lentes",
    "Panadería / Pastelería",
    "Parrilla / Asadero",
    "Peluquería",
    "Pesca y mariscos",
    "Pets shop / Tienda de mascotas",
    "Pinturas y acabados",
    "Pizzería / Fast food",
    "Plomería",
    "Pollería / Cevichería",
    "Productos agrícolas",
    "Productos naturales y orgánicos",
    "Productos para bebé",
    "Publicidad y diseño gráfico",
    "Reparación de calzado",
    "Reparación de celulares",
    "Reparación de electrodomésticos",
    "Restaurante",
    "Seguros",
    "Servicios de contabilidad",
    "Servicios de enfermería",
    "Servicios de seguridad",
    "Servicios de transporte",
    "Tejidos y bordados artesanales",
    "Telecomunicaciones",
    "Tienda de ropa",
    "Tintorería",
    "Zapatería",
  ];

  const listEl       = document.getElementById('activityList');
  const searchEl     = document.getElementById('searchInput');
  const btnContinuar = document.getElementById('btnContinuar');
  const btnAtras     = document.getElementById('btnAtras');

  let selectedActividad = localStorage.getItem('actividad_negocio') || null;

  function normalize(str) {
    return str.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
  }

  function renderList(items) {
    listEl.innerHTML = '';

    if (items.length === 0) {
      const msg = document.createElement('p');
      msg.className = 'empty-msg';
      msg.textContent = 'No se encontraron resultados';
      listEl.appendChild(msg);
      return;
    }

    items.forEach(function(actividad) {
      const item = document.createElement('div');
      item.className = 'activity-item' + (actividad === selectedActividad ? ' activity-item--selected' : '');
      item.setAttribute('role', 'option');
      item.setAttribute('aria-selected', actividad === selectedActividad ? 'true' : 'false');

      const label = document.createElement('span');
      label.className = 'activity-item__label';
      label.textContent = actividad;

      const isSelected = actividad === selectedActividad;
      const radio = document.createElement('div');
      radio.className = 'radio-btn';
      radio.setAttribute('aria-hidden', 'true');
      radio.innerHTML = isSelected
        ? '<svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 28 28" fill="none"><path d="M5.11111 14C5.11111 9.0908 9.0908 5.11111 14 5.11111C18.9092 5.11111 22.8889 9.0908 22.8889 14C22.8889 18.9092 18.9092 22.8889 14 22.8889C9.0908 22.8889 5.11111 18.9092 5.11111 14Z" fill="white"/><path fill-rule="evenodd" clip-rule="evenodd" d="M14 24C8.47715 24 4 19.5228 4 14C4 8.47715 8.47715 4 14 4C19.5228 4 24 8.47715 24 14C24 19.5228 19.5228 24 14 24ZM14 5.11111C9.0908 5.11111 5.11111 9.0908 5.11111 14C5.11111 18.9092 9.0908 22.8889 14 22.8889C18.9092 22.8889 22.8889 18.9092 22.8889 14C22.8889 9.0908 18.9092 5.11111 14 5.11111Z" fill="#EE424E"/><path d="M9.55556 14C9.55556 11.5454 11.5454 9.55556 14 9.55556C16.4546 9.55556 18.4444 11.5454 18.4444 14C18.4444 16.4546 16.4546 18.4444 14 18.4444C11.5454 18.4444 9.55556 16.4546 9.55556 14Z" fill="#EE424E"/></svg>'
        : '<svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 28 28" fill="none"><path d="M14 4.5C19.2467 4.5 23.5 8.7533 23.5 14C23.5 19.2467 19.2467 23.5 14 23.5C8.7533 23.5 4.5 19.2467 4.5 14C4.5 8.7533 8.7533 4.5 14 4.5Z" fill="white" stroke="#091144"/></svg>';

      item.appendChild(label);
      item.appendChild(radio);
      item.addEventListener('click', function() { selectActividad(actividad); });
      listEl.appendChild(item);
    });
  }

  function selectActividad(actividad) {
    selectedActividad = actividad;
    btnContinuar.disabled = false;
    renderList(getFiltered());
  }

  function getFiltered() {
    var q = normalize(searchEl.value.trim());
    return q ? actividades.filter(function(a) { return normalize(a).includes(q); }) : actividades;
  }

  searchEl.addEventListener('input', function() { renderList(getFiltered()); });

  btnAtras.addEventListener('click', function() {
    window.location.href = 'ingresos_esperados.html';
  });

  function showBottomSheet() {
    document.getElementById('bsOverlay').classList.add('bs-overlay--visible');
    document.getElementById('bottomSheet').classList.add('bs--visible');
  }

  btnContinuar.addEventListener('click', function() {
    if (!selectedActividad) return;
    localStorage.setItem('actividad_negocio', selectedActividad);
    showBottomSheet();
  });

  document.getElementById('btnInvitar').addEventListener('click', function() {
    window.location.href = '09-invitar-trabajadores.html';
  });

  document.getElementById('btnNoInvitar').addEventListener('click', function() {
    window.location.href = '08-cuenta-bancaria.html';
  });

  renderList(actividades);
  if (selectedActividad) btnContinuar.disabled = false;
</script>

</body>
</html>
