<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Bold – Correo y número del negocio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Roboto:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../components/shared.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #D0D3E0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 40px 0;
      min-height: 100vh;
    }

    @media (max-width: 430px) {
      body {
        padding: 0;
        min-height: 100dvh;
      }
    }

    /* ── Phone shell ── */
    .phone {
      width: 393px;
      height: 100dvh;
      background: #F7F8FB;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    @media (max-width: 430px) {
      .phone {
        width: 100%;
        height: 100dvh;
        border-radius: 0;
        box-shadow: none;
      }
    }

    /* ══ HEADER ══ */
    .header {
      flex-shrink: 0;
      display: flex; flex-direction: column;
      gap: 20px; padding-bottom: 16px;
    }
    .status-bar {
      height: 20px; position: relative;
      display: flex; align-items: center; padding: 0 8px;
    }
    .status-bar__time {
      position: absolute; left: 50%; top: 50%;
      transform: translate(-50%, -50%);
      font-family: Roboto, sans-serif; font-weight: 600; font-size: 12px; color: #1E1E1E; line-height: 1;
    }
    .status-bar__right {
      position: absolute; right: 5px; top: 50%;
      transform: translateY(-50%);
      display: flex; align-items: center; gap: 4px;
    }
    .status-bar__carrier {
      font-family: Roboto, sans-serif; font-weight: 400; font-size: 12px;
      letter-spacing: -0.0014em; color: #1E1E1E; line-height: 1;
    }
    .nav-bar {
      display: flex; justify-content: space-between;
      align-items: center; padding: 0 12px;
    }
    .nav-left  { width: 102px; display: flex; align-items: center; }
    .nav-center { flex: 1; }
    .nav-right  { width: 102px; display: flex; justify-content: flex-end; }

    /* ══ BODY ══ */
    .body {
      flex: 1;
      height: 100%;
      display: flex; flex-direction: column;
      gap: 32px; padding: 0 16px;
      overflow-y: auto; scrollbar-width: none;
    }
    .body::-webkit-scrollbar { display: none; }

    .text-section { display: flex; flex-direction: column; gap: 8px; }
    .subtitle {
      font-family: Montserrat, sans-serif; font-weight: 400;
      font-size: 14px; line-height: 20px; color: #1E1E1E;
    }

    .form-section { display: flex; flex-direction: column; gap: 16px; }
    .field-block   { display: flex; flex-direction: column; gap: 8px; }


    /* ══ FOOTER ══ */
    .footer {
      flex-shrink: 0; margin-top: auto; display: flex; flex-direction: column;
      gap: 20px; padding: 0 16px 20px;
    }
    .progress-bar { display: flex; gap: 8px; }
    .progress-bar__seg {
      flex: 1; height: 2px; border-radius: 1px;
      background: #D2D4E1; position: relative; overflow: hidden;
    }
    .progress-bar__fill {
      position: absolute; left: 0; top: 0; height: 100%;
      background: #FF2947; border-radius: 1px;
    }
    .action-bar { display: flex; justify-content: space-between; align-items: center; }
    .btn-continuar { width: 140px; }

    /* ══ AYUDA ══ */
    .ayuda-btn {
      position: absolute; top: 40px; right: 16px;
      display: flex; flex-direction: row; align-items: center; gap: 4px;
      padding: 8px 8px 8px 12px;
      background: #FFFFFF; border: none; border-radius: 100px;
      box-shadow: 0px 4px 12px 0px rgba(18, 30, 108, 0.08);
      cursor: pointer; height: 32px; z-index: 10;
    }
    .ayuda-btn__label {
      font-family: Montserrat, sans-serif; font-weight: 500;
      font-size: 14px; line-height: 20px; color: #121E6C;
    }
    .ayuda-btn__icon { width: 20px; height: 20px; display: flex; align-items: center; justify-content: center; }
  </style>
</head>
<body>

<div class="phone">

  <!-- ── HEADER ── -->
  <div class="header">
    <div class="status-bar">
      <span class="status-bar__time">1:11 PM</span>
      <div class="status-bar__right">
        <svg width="17" height="11" viewBox="0 0 17 11" fill="none" aria-hidden="true">
          <rect x="0"  y="7"    width="3.1" height="4"    rx="0.5" fill="#1E1E1E"/>
          <rect x="4"  y="5"    width="3.1" height="6"    rx="0.5" fill="#1E1E1E"/>
          <rect x="8"  y="3"    width="3.1" height="8"    rx="0.5" fill="#1E1E1E"/>
          <rect x="12" y="0.5"  width="3.1" height="10.5" rx="0.5" fill="#1E1E1E"/>
        </svg>
        <svg width="16" height="12" viewBox="0 0 16 12" fill="none" aria-hidden="true">
          <circle cx="8" cy="10.5" r="1.3" fill="#1E1E1E"/>
          <path d="M4.8 7.5C5.8 6.5 6.9 6 8 6s2.2.5 3.2 1.5"  stroke="#1E1E1E" stroke-width="1.3" stroke-linecap="round" fill="none"/>
          <path d="M2.2 5C3.7 3.4 5.8 2.5 8 2.5s4.3.9 5.8 2.5" stroke="#1E1E1E" stroke-width="1.3" stroke-linecap="round" fill="none"/>
          <path d="M0 2.5C2.1.9 4.9 0 8 0s5.9.9 8 2.5"          stroke="#1E1E1E" stroke-width="1.3" stroke-linecap="round" fill="none"/>
        </svg>
        <span class="status-bar__carrier">Carrier</span>
      </div>
    </div>
    <div class="nav-bar">
      <div class="nav-left">
        <button class="c-btn-close"
                onclick="window.location.href='../index.html?skip_location=true'"
                aria-label="Cerrar">
          <img src="../components/ic_close.svg" width="24" height="24" alt="">
        </button>
      </div>
      <div class="nav-center"></div>
      <div class="nav-right"></div>
    </div>
  </div>

  <!-- ── BODY ── -->
  <div class="body">

    <div class="text-section">
      <h1 class="c-screen-title">¿Cuál es el correo y número de tu negocio?</h1>
      <p class="subtitle">Puedes usar los mismos datos de tu cuenta personal.</p>
    </div>

    <div class="form-section">

      <!-- ── Correo ── -->
      <div class="field-block">
        <div class="c-form-group">
          <label class="c-input-label" for="inputCorreo">Correo electrónico</label>
          <input class="c-input-field" type="email" id="inputCorreo"
                 autocapitalize="none"
                 autocorrect="off"
                 enterkeyhint="next"
                 placeholder="Escribe el correo de tu negocio"
                 autofocus
                 oninput="validateAndCheck()">
          <p class="c-error-msg" id="errorCorreo">Ingresa un correo con @gmail.com o @hotmail.com</p>
        </div>
        <label class="c-checkbox-label">
          <input class="c-checkbox-native" type="checkbox" id="chkCorreo"
                 onchange="handleCorreoCheckbox()">
          <span class="c-checkbox-visual">
            <span class="c-checkbox-mark"></span>
          </span>
          Usar mi correo personal.
        </label>
      </div>

      <!-- ── Número ── -->
      <div class="field-block">
        <div class="c-form-group">
          <label class="c-input-label" for="inputNumero">Número de teléfono</label>
          <input class="c-input-field" type="tel" id="inputNumero"
                 inputmode="numeric"
                 enterkeyhint="done"
                 placeholder="Escribe el número"
                 oninput="validateAndCheck()">
          <p class="c-error-msg" id="errorNumero">El número debe iniciar con 9 y tener mínimo 9 dígitos</p>
        </div>
        <label class="c-checkbox-label">
          <input class="c-checkbox-native" type="checkbox" id="chkNumero"
                 onchange="handleNumeroCheckbox()">
          <span class="c-checkbox-visual">
            <span class="c-checkbox-mark"></span>
          </span>
          Usar mi número de contacto personal
        </label>
      </div>

    </div>

  </div><!-- /body -->

  <!-- ── FOOTER ── -->
  <div class="footer">
    <div class="progress-bar" role="progressbar" aria-label="Paso 3 de 4, pantalla 4 de 8">
      <div class="progress-bar__seg">
        <div class="progress-bar__fill" style="width:100%"></div>
      </div>
      <div class="progress-bar__seg">
        <div class="progress-bar__fill" style="width:100%"></div>
      </div>
      <div class="progress-bar__seg">
        <div class="progress-bar__fill" style="width:50%"></div>
      </div>
    </div>
    <div class="action-bar">
      <button class="c-btn-text c-btn-text--active"
              onclick="window.location.href='formas_venta.html'">Atrás</button>
      <button class="c-btn-primary btn-continuar" id="btnContinuar"
              disabled onclick="goNext()">Continuar</button>
    </div>
  </div>

  <!-- ── AYUDA ── -->
  <button class="ayuda-btn" aria-label="Ayuda">
    <span class="ayuda-btn__label">Ayuda</span>
    <span class="ayuda-btn__icon">
      <img src="../fase-1/ic_ayuda_bot.svg" width="20" height="20" alt="">
    </span>
  </button>

</div><!-- /phone -->

<script>
  const inputCorreo = document.getElementById('inputCorreo');
  const inputNumero = document.getElementById('inputNumero');
  const chkCorreo   = document.getElementById('chkCorreo');
  const chkNumero   = document.getElementById('chkNumero');
  const errCorreo   = document.getElementById('errorCorreo');
  const errNumero   = document.getElementById('errorNumero');

  /* Enter en correo → foco a número */
  inputCorreo.addEventListener('keydown', function(e) {
    if (e.key === 'Enter') { e.preventDefault(); inputNumero.focus(); }
  });

  /* Blur: mostrar error si el campo queda inválido */
  inputCorreo.addEventListener('blur', () => {
    const val = inputCorreo.value.trim();
    if (val.length > 0 && !isCorreoValid(val)) {
      errCorreo.classList.add('c-visible');
      inputCorreo.classList.add('c-field-error');
    }
  });
  inputNumero.addEventListener('blur', () => {
    const val = inputNumero.value.trim();
    if (val.length > 0 && !isNumeroValid(val)) {
      errNumero.classList.add('c-visible');
      inputNumero.classList.add('c-field-error');
    }
  });

  /* ── Checkboxes: autorrelleno ── */
  function handleCorreoCheckbox() {
    if (chkCorreo.checked) {
      inputCorreo.value = localStorage.getItem('correo') || 'usuario@gmail.com';
      inputCorreo.readOnly = true;
      inputCorreo.classList.add('c-input-field--filled-disabled');
      inputCorreo.classList.remove('c-field-error');
      errCorreo.classList.remove('c-visible');
      if (!chkNumero.checked) inputNumero.focus();
    } else {
      inputCorreo.value = '';
      inputCorreo.readOnly = false;
      inputCorreo.classList.remove('c-input-field--filled-disabled');
      inputCorreo.focus();
    }
    validateAndCheck();
  }

  function handleNumeroCheckbox() {
    if (chkNumero.checked) {
      inputNumero.value = localStorage.getItem('celular') || '987654321';
      inputNumero.readOnly = true;
      inputNumero.classList.add('c-input-field--filled-disabled');
      inputNumero.classList.remove('c-field-error');
      errNumero.classList.remove('c-visible');
      if (!chkCorreo.checked) inputCorreo.focus();
    } else {
      inputNumero.value = '';
      inputNumero.readOnly = false;
      inputNumero.classList.remove('c-input-field--filled-disabled');
      inputNumero.focus();
    }
    validateAndCheck();
  }

  /* ── Validación ── */
  function isCorreoValid(val) {
    return /@gmail\.com|@hotmail\.com/i.test(val);
  }
  function isNumeroValid(val) {
    return /^9\d{8,}$/.test(val.replace(/\s/g, ''));
  }

  function validateAndCheck() {
    const correo = inputCorreo.value.trim();
    const numero = inputNumero.value.trim();

    if (!chkCorreo.checked) {
      const correoError = correo.length > 0 && !isCorreoValid(correo);
      errCorreo.classList.toggle('c-visible', correoError);
      inputCorreo.classList.toggle('c-field-error', correoError);
    }

    if (!chkNumero.checked) {
      const numeroError = numero.length > 0 && !isNumeroValid(numero);
      errNumero.classList.toggle('c-visible', numeroError);
      inputNumero.classList.toggle('c-field-error', numeroError);
    }

    const correoOk = chkCorreo.checked
      ? correo.length > 0
      : correo.length > 0 && isCorreoValid(correo);
    const numeroOk = chkNumero.checked
      ? numero.length > 0
      : numero.length > 0 && isNumeroValid(numero);

    document.getElementById('btnContinuar').disabled = !(correoOk && numeroOk);
  }

  /* ── Navegación ── */
  function goNext() {
    const correo = inputCorreo.value.trim();
    const numero = inputNumero.value.trim().replace(/\s/g, '');
    localStorage.setItem('correo_negocio', correo);
    localStorage.setItem('numero_negocio', numero);
    window.location.href = 'direccion_negocio.html';
  }
</script>

</body>
</html>
