<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=393, initial-scale=1">
  <title>Bold – Formas de venta</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Roboto:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../components/shared.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #D0D3E0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 40px 0;
      min-height: 100vh;
    }

    .phone {
      width: 393px;
      height: 852px;
      background: #F7F8FB;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    /* ══ HEADER ══ */
    .header {
      flex-shrink: 0;
      display: flex; flex-direction: column;
      gap: 20px; padding-bottom: 16px;
    }
    .status-bar {
      height: 20px; position: relative;
      display: flex; align-items: center; padding: 0 8px;
    }
    .status-bar__time {
      position: absolute; left: 50%; top: 50%;
      transform: translate(-50%, -50%);
      font-family: Roboto, sans-serif; font-weight: 600; font-size: 12px; color: #1E1E1E; line-height: 1;
    }
    .status-bar__right {
      position: absolute; right: 5px; top: 50%;
      transform: translateY(-50%);
      display: flex; align-items: center; gap: 4px;
    }
    .status-bar__carrier {
      font-family: Roboto, sans-serif; font-weight: 400; font-size: 12px;
      letter-spacing: -0.0014em; color: #1E1E1E; line-height: 1;
    }
    .nav-bar {
      display: flex; justify-content: space-between;
      align-items: center; padding: 0 12px;
    }
    .nav-left  { width: 102px; display: flex; align-items: center; }
    .nav-center { flex: 1; }
    .nav-right  { width: 102px; display: flex; justify-content: flex-end; }

    /* ══ BODY ══ */
    .body {
      flex: 1;
      display: flex; flex-direction: column;
      gap: 32px; padding: 0 16px;
      overflow-y: auto; scrollbar-width: none;
    }
    .body::-webkit-scrollbar { display: none; }

    .page-title {
      font-family: Montserrat, sans-serif;
      font-weight: 600; font-size: 20px; line-height: 20px; color: #1E1E1E;
    }

    /* ── Sección ── */
    .section {
      display: flex; flex-direction: column;
      align-items: stretch; gap: 24px;
    }
    .section__label {
      font-family: Montserrat, sans-serif;
      font-weight: 600; font-size: 16px; line-height: 16px; color: #1E1E1E;
    }

    /* ── Pills container ── */
    .pills {
      display: flex; flex-direction: row;
      flex-wrap: wrap;
      gap: 12px 16px;
    }

    /* ── Pill ── */
    .pill {
      border-radius: 100px;
      background: #FFFFFF;
      box-shadow: 0 4px 12px 0 rgba(18, 30, 108, 0.08);
      display: flex;
      padding: 8px 16px;
      justify-content: center;
      align-items: center;
      gap: 8px;
      border: 1px solid transparent;
      cursor: pointer;
      color: #1E1E1E;
      font-family: Montserrat, sans-serif;
      font-weight: 400; font-size: 14px; line-height: 20px;
      -webkit-tap-highlight-color: transparent;
      transition: border-color 0.15s, color 0.15s;
    }
    .pill--selected {
      border-color: #FF2947;
      color: #FF2947;
      font-weight: 600;
    }
    .pill svg { flex-shrink: 0; }

    /* ══ FOOTER ══ */
    .footer {
      flex-shrink: 0; display: flex; flex-direction: column;
      gap: 20px; padding: 0 16px 20px;
    }
    .progress-bar { display: flex; gap: 8px; }
    .progress-bar__seg {
      flex: 1; height: 2px; border-radius: 1px;
      background: #D2D4E1; position: relative; overflow: hidden;
    }
    .progress-bar__fill {
      position: absolute; left: 0; top: 0; height: 100%;
      background: #FF2947; border-radius: 1px;
    }
    .action-bar { display: flex; justify-content: space-between; align-items: center; }
    .btn-continuar { width: 140px; }

    /* ══ AYUDA ══ */
    .ayuda-btn {
      position: absolute; top: 40px; right: 16px;
      display: flex; flex-direction: row; align-items: center; gap: 4px;
      padding: 8px 8px 8px 12px;
      background: #FFFFFF; border: none; border-radius: 100px;
      box-shadow: 0px 4px 12px 0px rgba(18, 30, 108, 0.08);
      cursor: pointer; height: 32px; z-index: 10;
    }
    .ayuda-btn__label {
      font-family: Montserrat, sans-serif; font-weight: 500;
      font-size: 14px; line-height: 20px; color: #121E6C;
    }
    .ayuda-btn__icon { width: 20px; height: 20px; display: flex; align-items: center; justify-content: center; }
  </style>
</head>

<script>
  /* ── Estado ── */
  const ventaSeleccionadas = new Set();
  let equipoSeleccionado = '';

  /* ── Formas de venta: múltiple ── */
  function toggleVenta(pill) {
    const val = pill.dataset.value;
    if (ventaSeleccionadas.has(val)) {
      ventaSeleccionadas.delete(val);
      pill.classList.remove('pill--selected');
    } else {
      ventaSeleccionadas.add(val);
      pill.classList.add('pill--selected');
    }
    checkForm();
  }

  /* ── Equipo: única ── */
  function selectEquipo(pill) {
    document.querySelectorAll('#pillsEquipo .pill').forEach(p => p.classList.remove('pill--selected'));
    pill.classList.add('pill--selected');
    equipoSeleccionado = pill.dataset.value;
    checkForm();
  }

  /* ── Validación ── */
  function checkForm() {
    document.getElementById('btnContinuar').disabled =
      ventaSeleccionadas.size === 0 || equipoSeleccionado === '';
  }

  /* ── Persistencia y navegación ── */
  function goNext() {
    if (ventaSeleccionadas.size === 0 || equipoSeleccionado === '') return;
    localStorage.setItem('formas_venta', JSON.stringify([...ventaSeleccionadas]));
    localStorage.setItem('tamano_equipo', equipoSeleccionado);
    window.location.href = 'correo_numero.html';
  }
</script>
