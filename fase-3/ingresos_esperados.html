<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Bold – Ingresos esperados</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Roboto:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../components/shared.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #D0D3E0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 40px 0;
      min-height: 100vh;
    }

    /* ── Phone shell: 863px (incluye teclado) ── */
    .phone {
      width: 393px;
      height: 863px;
      background: #F7F8FB;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    /* ══ HEADER ══ */
    .header {
      flex-shrink: 0;
      display: flex; flex-direction: column;
      gap: 20px; padding-bottom: 16px;
    }
    .status-bar {
      height: 20px; position: relative;
      display: flex; align-items: center; padding: 0 8px;
    }
    .status-bar__time {
      position: absolute; left: 50%; top: 50%;
      transform: translate(-50%, -50%);
      font-family: Roboto, sans-serif; font-weight: 600; font-size: 12px; color: #1E1E1E; line-height: 1;
    }
    .status-bar__right {
      position: absolute; right: 5px; top: 50%;
      transform: translateY(-50%);
      display: flex; align-items: center; gap: 4px;
    }
    .status-bar__carrier {
      font-family: Roboto, sans-serif; font-weight: 400; font-size: 12px;
      letter-spacing: -0.0014em; color: #1E1E1E; line-height: 1;
    }
    .nav-bar {
      display: flex; justify-content: space-between;
      align-items: center; padding: 0 12px;
    }
    .nav-left  { width: 102px; display: flex; align-items: center; }
    .nav-center { flex: 1; }
    .nav-right  { width: 102px; display: flex; justify-content: flex-end; }

    /* ══ BODY ══ */
    .body {
      flex: 1;
      display: flex; flex-direction: column;
      gap: 32px; padding: 0 16px;
      overflow-y: auto; scrollbar-width: none;
    }
    .body::-webkit-scrollbar { display: none; }

    .text-section { display: flex; flex-direction: column; gap: 8px; }
    .subtitle {
      font-family: Montserrat, sans-serif; font-weight: 400;
      font-size: 14px; line-height: 20px; color: #1E1E1E;
    }

    /* ── Campo de monto ── */
    .amount-field {
      width: 100%;
      height: 56px;
      padding: 0 16px;
      background: #FFFFFF;
      border: 1px solid #121E6C;
      border-radius: 12px;
      font-family: Montserrat, sans-serif;
      font-weight: 500;
      font-size: 14px;
      line-height: 20px;
      color: #1E1E1E;
      outline: none;
      -webkit-appearance: none;
      cursor: default;
      caret-color: transparent;
    }

    /* ══ FOOTER ══ */
    .footer {
      flex-shrink: 0; display: flex; flex-direction: column;
      gap: 20px; padding: 0 16px 20px;
    }
    .progress-bar { display: flex; gap: 8px; }
    .progress-bar__seg {
      flex: 1; height: 2px; border-radius: 1px;
      background: #D2D4E1; position: relative; overflow: hidden;
    }
    .progress-bar__fill {
      position: absolute; left: 0; top: 0; height: 100%;
      background: #FF2947; border-radius: 1px;
    }
    .action-bar { display: flex; justify-content: space-between; align-items: center; }
    .btn-continuar { width: 140px; }

    /* ══ NUMERIC KEYBOARD ══ */
    .kb-numeric {
      flex-shrink: 0; width: 100%; height: 290px;
      background: #D1D3D9; position: relative; overflow: hidden;
    }
    .kb-num-rows {
      position: absolute; left: 3px; right: 3px; top: 6px;
      display: flex; flex-direction: column; gap: 12px;
    }
    .kb-num-row { display: flex; gap: 6px; }
    .kb-num-key {
      flex: 1; height: 55px;
      background: #FFFFFF; border-radius: 4.6px;
      box-shadow: 0px 1px 0px 0px rgba(0,0,0,0.30);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      cursor: pointer; user-select: none; gap: 1px;
      font-family: -apple-system, 'Helvetica Neue', sans-serif;
      font-size: 22px; font-weight: 300; color: #000;
      -webkit-tap-highlight-color: transparent;
    }
    .kb-num-key:active { background: #ACB0BD; }
    .kb-num-key__sub {
      font-size: 9px; font-weight: 500; letter-spacing: 0.08em;
      color: #000; line-height: 1;
    }
    .kb-num-key--special {
      background: #ACB0BE; box-shadow: none;
    }
    .kb-num-key--special:active { background: #888D9A; }
    .kb-num-key--empty {
      background: #D1D3D9; box-shadow: none; pointer-events: none;
    }
    .kb-home {
      position: absolute; bottom: 8px; left: 50%;
      transform: translateX(-50%);
      width: 134px; height: 5px;
      background: #1C1C1E; border-radius: 3px; opacity: 0.18;
    }

    /* ══ AYUDA ══ */
    .ayuda-btn {
      position: absolute; top: 40px; right: 16px;
      display: flex; flex-direction: row; align-items: center; gap: 4px;
      padding: 8px 8px 8px 12px;
      background: #FFFFFF; border: none; border-radius: 100px;
      box-shadow: 0px 4px 12px 0px rgba(18, 30, 108, 0.08);
      cursor: pointer; height: 32px; z-index: 10;
    }
    .ayuda-btn__label {
      font-family: Montserrat, sans-serif; font-weight: 500;
      font-size: 14px; line-height: 20px; color: #121E6C;
    }
    .ayuda-btn__icon { width: 20px; height: 20px; display: flex; align-items: center; justify-content: center; }
  
    /* ── Mobile: sin frame, pantalla completa ── */
    html.is-mobile body {
      padding: 0;
      align-items: stretch;
      background: #F7F8FB;
    }
    html.is-mobile .phone {
      width: 100% !important;
      height: 100dvh !important;
      min-height: unset !important;
      overflow-x: hidden;
    }
    html.is-mobile .footer {
      padding-bottom: env(safe-area-inset-bottom);
    }
  </style>
  <script>
    (function() {
      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent) || window.innerWidth <= 430) {
        document.documentElement.classList.add('is-mobile');
      }
    })();
  </script>
</head>
<body>

<div class="phone">

  <!-- ── HEADER ── -->
  <div class="header">
    <div class="status-bar">
      <span class="status-bar__time">1:11 PM</span>
      <div class="status-bar__right">
        <svg width="17" height="11" viewBox="0 0 17 11" fill="none" aria-hidden="true">
          <rect x="0"  y="7"    width="3.1" height="4"    rx="0.5" fill="#1E1E1E"/>
          <rect x="4"  y="5"    width="3.1" height="6"    rx="0.5" fill="#1E1E1E"/>
          <rect x="8"  y="3"    width="3.1" height="8"    rx="0.5" fill="#1E1E1E"/>
          <rect x="12" y="0.5"  width="3.1" height="10.5" rx="0.5" fill="#1E1E1E"/>
        </svg>
        <svg width="16" height="12" viewBox="0 0 16 12" fill="none" aria-hidden="true">
          <circle cx="8" cy="10.5" r="1.3" fill="#1E1E1E"/>
          <path d="M4.8 7.5C5.8 6.5 6.9 6 8 6s2.2.5 3.2 1.5"  stroke="#1E1E1E" stroke-width="1.3" stroke-linecap="round" fill="none"/>
          <path d="M2.2 5C3.7 3.4 5.8 2.5 8 2.5s4.3.9 5.8 2.5" stroke="#1E1E1E" stroke-width="1.3" stroke-linecap="round" fill="none"/>
          <path d="M0 2.5C2.1.9 4.9 0 8 0s5.9.9 8 2.5"          stroke="#1E1E1E" stroke-width="1.3" stroke-linecap="round" fill="none"/>
        </svg>
        <span class="status-bar__carrier">Carrier</span>
      </div>
    </div>
    <div class="nav-bar">
      <div class="nav-left">
        <button class="c-btn-close"
                onclick="window.location.href='../index.html?skip_location=true'"
                aria-label="Cerrar">
          <img src="../components/ic_close.svg" width="24" height="24" alt="">
        </button>
      </div>
      <div class="nav-center"></div>
      <div class="nav-right"></div>
    </div>
  </div>

  <!-- ── BODY ── -->
  <div class="body">

    <div class="text-section">
      <h1 class="c-screen-title">¿Cuánto esperas vender al final de este mes?</h1>
      <p class="subtitle">Esto nos ayudará a conocer mejor tu negocio y ofrecerle soluciones personalizadas.</p>
    </div>

    <div class="c-form-group">
      <label class="c-input-label" for="inputVentas">Ventas aproximadas del mes en soles</label>
      <input class="amount-field" type="text" id="inputVentas"
             inputmode="none" readonly value="">
    </div>

  </div><!-- /body -->

  <!-- ── FOOTER ── -->
  <div class="footer">
    <div class="progress-bar" role="progressbar" aria-label="Paso 3 de 4, pantalla 6 de 8">
      <div class="progress-bar__seg">
        <div class="progress-bar__fill" style="width:100%"></div>
      </div>
      <div class="progress-bar__seg">
        <div class="progress-bar__fill" style="width:100%"></div>
      </div>
      <div class="progress-bar__seg">
        <div class="progress-bar__fill" style="width:75%"></div>
      </div>
    </div>
    <div class="action-bar">
      <button class="c-btn-text c-btn-text--active"
              onclick="window.location.href='direccion_negocio.html'">Atrás</button>
      <button class="c-btn-primary btn-continuar" id="btnContinuar"
              disabled onclick="goNext()">Continuar</button>
    </div>
  </div>

  <!-- ── NUMERIC KEYBOARD ── -->
  <div class="kb-numeric" aria-hidden="true">
    <div class="kb-num-rows">
      <div class="kb-num-row">
        <div class="kb-num-key" onclick="typeNum('1')">1<span class="kb-num-key__sub">&nbsp;</span></div>
        <div class="kb-num-key" onclick="typeNum('2')">2<span class="kb-num-key__sub">ABC</span></div>
        <div class="kb-num-key" onclick="typeNum('3')">3<span class="kb-num-key__sub">DEF</span></div>
      </div>
      <div class="kb-num-row">
        <div class="kb-num-key" onclick="typeNum('4')">4<span class="kb-num-key__sub">GHI</span></div>
        <div class="kb-num-key" onclick="typeNum('5')">5<span class="kb-num-key__sub">JKL</span></div>
        <div class="kb-num-key" onclick="typeNum('6')">6<span class="kb-num-key__sub">MNO</span></div>
      </div>
      <div class="kb-num-row">
        <div class="kb-num-key" onclick="typeNum('7')">7<span class="kb-num-key__sub">PQRS</span></div>
        <div class="kb-num-key" onclick="typeNum('8')">8<span class="kb-num-key__sub">TUV</span></div>
        <div class="kb-num-key" onclick="typeNum('9')">9<span class="kb-num-key__sub">WXYZ</span></div>
      </div>
      <div class="kb-num-row">
        <div class="kb-num-key kb-num-key--empty"></div>
        <div class="kb-num-key" onclick="typeNum('0')">0</div>
        <div class="kb-num-key kb-num-key--special" onclick="deleteNum()">
          <svg width="20" height="15" viewBox="0 0 24 18" fill="none">
            <path d="M9.5 1H21C22.1 1 23 1.9 23 3V15C23 16.1 22.1 17 21 17H9.5C8.9 17 8.3 16.7 7.9 16.2L1.5 9L7.9 1.8C8.3 1.3 8.9 1 9.5 1Z" fill="none" stroke="#3C3C43" stroke-width="1.2" stroke-opacity="0.6"/>
            <path d="M15 6L11 12M11 6L15 12" stroke="#3C3C43" stroke-width="1.5" stroke-linecap="round" stroke-opacity="0.6"/>
          </svg>
        </div>
      </div>
    </div>
    <div class="kb-home"></div>
  </div>

  <!-- ── AYUDA ── -->
  <button class="ayuda-btn" aria-label="Ayuda">
    <span class="ayuda-btn__label">Ayuda</span>
    <span class="ayuda-btn__icon">
      <img src="../fase-1/ic_ayuda_bot.svg" width="20" height="20" alt="">
    </span>
  </button>

</div><!-- /phone -->

<script>
  let rawDigits = '';

  function typeNum(d) {
    if (rawDigits.length >= 9) return;
    rawDigits += d;
    updateDisplay();
    checkForm();
  }

  function deleteNum() {
    rawDigits = rawDigits.slice(0, -1);
    updateDisplay();
    checkForm();
  }

  function updateDisplay() {
    const input = document.getElementById('inputVentas');
    if (rawDigits === '') {
      input.value = '';
      return;
    }
    const n = parseInt(rawDigits, 10);
    input.value = 'S/' + n.toLocaleString('en-US') + '.00';
  }

  function checkForm() {
    const n = rawDigits ? parseInt(rawDigits, 10) : 0;
    document.getElementById('btnContinuar').disabled = n < 100000;
  }

  function goNext() {
    if (!rawDigits || parseInt(rawDigits, 10) < 100000) return;
    localStorage.setItem('ventas_esperadas', rawDigits);
    window.location.href = '07-actividad-economica.html';
  }
</script>

</body>
</html>
