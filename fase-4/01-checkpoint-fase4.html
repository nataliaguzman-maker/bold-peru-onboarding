<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=393, initial-scale=1">
  <title>Bold – Verificando tu información</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Roboto:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../components/shared.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #D0D3E0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 40px 0;
      min-height: 100vh;
    }

    /* ── Phone shell: checkpoint gradient ── */
    .phone {
      width: 393px;
      height: 852px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
      background:
        linear-gradient(0deg, rgba(247, 248, 251, 0.20) 0%, rgba(247, 248, 251, 0.20) 100%),
        linear-gradient(135deg, rgba(8, 14, 255, 0.10) 0%, rgba(255, 255, 255, 0.03) 51%, rgba(8, 14, 255, 0.20) 100%),
        #FFFFFF;
      box-shadow: 1px 1px 16.1px 0px rgba(18, 30, 108, 0.10) inset;
      backdrop-filter: blur(36.4px);
      -webkit-backdrop-filter: blur(36.4px);
    }

    /* ══ HEADER ══ */
    .header {
      flex-shrink: 0;
      display: flex; flex-direction: column;
      gap: 20px; padding-bottom: 16px;
    }
    .status-bar {
      height: 20px; position: relative;
      display: flex; align-items: center; padding: 0 8px;
    }
    .status-bar__time {
      position: absolute; left: 50%; top: 50%;
      transform: translate(-50%, -50%);
      font-family: Roboto, sans-serif; font-weight: 600; font-size: 12px; color: #1E1E1E; line-height: 1;
    }
    .status-bar__right {
      position: absolute; right: 5px; top: 50%;
      transform: translateY(-50%);
      display: flex; align-items: center; gap: 4px;
    }
    .status-bar__carrier {
      font-family: Roboto, sans-serif; font-weight: 400; font-size: 12px;
      letter-spacing: -0.0014em; color: #1E1E1E; line-height: 1;
    }
    .nav-bar {
      display: flex; justify-content: space-between;
      align-items: center; padding: 0 12px;
    }
    .nav-left  { width: 102px; display: flex; align-items: center; }
    .nav-center { flex: 1; }
    .nav-right  { width: 102px; display: flex; justify-content: flex-end; }

    /* ══ BODY ══ */
    .body {
      flex: 1;
      display: flex; flex-direction: column;
      justify-content: center;
      align-items: stretch;
      gap: 48px;
      padding: 0 16px;
    }

    /* ── Loader + text section ── */
    .section-header {
      display: flex; flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    /* ── Animated loader ── */
    .loader-wrap {
      position: relative;
      width: 160px;
      height: 160px;
      flex-shrink: 0;
    }
    .loader-photo {
      position: absolute;
      width: 129px;
      height: 129px;
      border-radius: 50%;
      object-fit: cover;
      top: 16px;
      left: 16px;
      background: #D2D4E1;
    }
    .loader-gif {
      position: absolute;
      width: 160px;
      height: 160px;
      top: 0; left: 0;
      pointer-events: none;
    }

    /* ── Title + subtitle ── */
    .text-section {
      display: flex; flex-direction: column;
      align-items: stretch;
      gap: 4px;
      text-align: center;
    }
    .title {
      font-family: Montserrat, sans-serif;
      font-weight: 600; font-size: 20px; line-height: 24px;
      color: #1E1E1E;
    }
    .subtitle {
      font-family: Montserrat, sans-serif;
      font-weight: 400; font-size: 14px; line-height: 20px;
      color: #969BBD;
    }

    /* ── Steps card ── */
    .steps-card {
      display: flex; flex-direction: column;
      align-items: stretch;
      gap: 0;
    }

    .step-item {
      display: flex;
      flex-direction: row;
      align-items: center;
      gap: 12px;
      padding: 8px 16px 8px 8px;
      background: #FFFFFF;
      border-radius: 100px;
    }

    .steps-divider {
      height: 1px;
      background: #F1F2F6;
      margin: 4px 0;
    }

    /* ── Step bubble ── */
    .step-bubble {
      flex-shrink: 0;
      width: 40px; height: 40px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
    }
    .step-bubble--active {
      background:
        linear-gradient(-75deg, rgba(8,14,255,0.1) 0%, rgba(255,255,255,0.5) 44%, rgba(8,14,255,0.1) 100%),
        rgba(255,255,255,0.5);
      box-shadow: inset 1px 1px 12px 0px rgba(18, 30, 108, 0.16);
    }
    .step-bubble--pending {
      background: #F7F8FB;
    }
    .step-bubble__number {
      font-family: Montserrat, sans-serif;
      font-weight: 700; font-size: 16px; line-height: 20px;
    }
    .step-bubble--active .step-bubble__number { color: #121E6C; }
    .step-bubble--pending .step-bubble__number { color: #D2D4E1; }

    /* ── Step text ── */
    .step-text {
      flex: 1;
      display: flex; flex-direction: column;
      gap: 4px;
    }
    .step-title {
      font-family: Montserrat, sans-serif;
      font-weight: 600; font-size: 12px; line-height: 16px;
    }
    .step-title--active  { color: #1E1E1E; }
    .step-title--pending { color: #969696; }
    .step-sub {
      font-family: Montserrat, sans-serif;
      font-weight: 400; font-size: 12px; line-height: 16px;
    }
    .step-sub--active  { color: #606060; }
    .step-sub--pending { color: #969696; }

    /* ── Step check icon ── */
    .step-check {
      flex-shrink: 0;
      width: 20px; height: 20px;
      display: flex; align-items: center; justify-content: center;
    }

    /* ══ AYUDA ══ */
    .ayuda-btn {
      position: absolute; top: 40px; right: 16px;
      display: flex; flex-direction: row; align-items: center; gap: 4px;
      padding: 8px 8px 8px 12px;
      background: #FFFFFF; border: none; border-radius: 100px;
      box-shadow: 0px 4px 12px 0px rgba(18, 30, 108, 0.08);
      cursor: pointer; height: 32px; z-index: 10;
    }
    .ayuda-btn__label {
      font-family: Montserrat, sans-serif; font-weight: 500;
      font-size: 14px; line-height: 20px; color: #121E6C;
    }
    .ayuda-btn__icon { width: 20px; height: 20px; display: flex; align-items: center; justify-content: center; }
  </style>
</head>
<body>

<div class="phone">

  <!-- ── HEADER ── -->
  <div class="header">
    <div class="status-bar">
      <span class="status-bar__time">1:11 PM</span>
      <div class="status-bar__right">
        <svg width="17" height="11" viewBox="0 0 17 11" fill="none" aria-hidden="true">
          <rect x="0"  y="7"    width="3.1" height="4"    rx="0.5" fill="#1E1E1E"/>
          <rect x="4"  y="5"    width="3.1" height="6"    rx="0.5" fill="#1E1E1E"/>
          <rect x="8"  y="3"    width="3.1" height="8"    rx="0.5" fill="#1E1E1E"/>
          <rect x="12" y="0.5"  width="3.1" height="10.5" rx="0.5" fill="#1E1E1E"/>
        </svg>
        <svg width="16" height="12" viewBox="0 0 16 12" fill="none" aria-hidden="true">
          <circle cx="8" cy="10.5" r="1.3" fill="#1E1E1E"/>
          <path d="M4.8 7.5C5.8 6.5 6.9 6 8 6s2.2.5 3.2 1.5"  stroke="#1E1E1E" stroke-width="1.3" stroke-linecap="round" fill="none"/>
          <path d="M2.2 5C3.7 3.4 5.8 2.5 8 2.5s4.3.9 5.8 2.5" stroke="#1E1E1E" stroke-width="1.3" stroke-linecap="round" fill="none"/>
          <path d="M0 2.5C2.1.9 4.9 0 8 0s5.9.9 8 2.5"          stroke="#1E1E1E" stroke-width="1.3" stroke-linecap="round" fill="none"/>
        </svg>
        <span class="status-bar__carrier">Carrier</span>
      </div>
    </div>
    <div class="nav-bar">
      <div class="nav-left">
        <button class="c-btn-close"
                onclick="window.location.href='../index.html'"
                aria-label="Cerrar">
          <img src="../components/ic_close.svg" width="24" height="24" alt="">
        </button>
      </div>
      <div class="nav-center"></div>
      <div class="nav-right"></div>
    </div>
  </div>

  <!-- ── BODY ── -->
  <div class="body">

    <!-- Loader + títulos -->
    <div class="section-header">
      <div class="loader-wrap" aria-hidden="true">
        <img class="loader-photo" src="imagen dueños grande.png" alt="">
        <img class="loader-gif" src="loader.gif" alt="">
      </div>
      <div class="text-section">
        <h1 class="title">Danos un momento mientras verificamos tu información</h1>
        <p class="subtitle">Nos tomará máximo 15 minutos.</p>
      </div>
    </div>

    <!-- Pasos -->
    <div class="steps-card" role="list">

      <!-- Paso 1: completado -->
      <div class="step-item" role="listitem">
        <div class="step-bubble step-bubble--active" aria-hidden="true">
          <span class="step-bubble__number">1</span>
        </div>
        <div class="step-text">
          <span class="step-title step-title--active">Creaste tu primer negocio</span>
          <span class="step-sub step-sub--active" id="nombreNegocio"></span>
        </div>
        <div class="step-check" aria-label="Completado">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none" aria-hidden="true">
            <circle cx="10" cy="10" r="9" fill="#1DB954"/>
            <path d="M6.5 10L8.8 12.5L13.5 7.5" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
      </div>

      <div class="steps-divider" aria-hidden="true"></div>

      <!-- Paso 2: en proceso -->
      <div class="step-item" role="listitem">
        <div class="step-bubble step-bubble--pending" aria-hidden="true">
          <span class="step-bubble__number">2</span>
        </div>
        <div class="step-text">
          <span class="step-title step-title--pending">Verificación en proceso...</span>
          <span class="step-sub step-sub--pending">Podría tardar unos minutos</span>
        </div>
      </div>

    </div><!-- /steps-card -->

  </div><!-- /body -->

  <!-- ── AYUDA ── -->
  <button class="ayuda-btn" aria-label="Ayuda">
    <span class="ayuda-btn__label">Ayuda</span>
    <span class="ayuda-btn__icon">
      <img src="../fase-1/ic_ayuda_bot.svg" width="20" height="20" alt="">
    </span>
  </button>

</div><!-- /phone -->

<script>
  var nombre = localStorage.getItem('nombre_negocio') || '';
  document.getElementById('nombreNegocio').textContent = nombre;
</script>

</body>
</html>
